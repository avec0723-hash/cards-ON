<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>단어 스와이프 · Day 37–38</title>
<meta name="description" content="80단어 × 예문 160개. 발음기호와 듣기 버튼, 문장 빈칸 모드까지. 탭하면 뜻, 밀면 O/X. 몰랐던 단어만 다시 나옵니다.">
<meta name="theme-color" content="#FFF8EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:type" content="website">
<meta property="og:site_name" content="매일영어">
<meta property="og:title" content="단어 스와이프 · Day 37–38">
<meta property="og:description" content="80단어 × 예문 160개. 발음기호와 듣기까지. 탭하면 쓰임, 밀면 O/X. 문장 빈칸으로 활용까지 익힙니다.">
<meta property="og:locale" content="ko_KR">
<meta property="og:url" content="https://avec0723-hash.github.io/cards-ON/vocab-day37-38.html">
<meta property="og:image" content="https://avec0723-hash.github.io/cards-ON/vocab-day37-38-og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="단어 스와이프 · Day 37–38">
<meta name="twitter:description" content="80단어 × 예문 160개. 탭하면 쓰임, 밀면 O/X.">
<style>
  :root{
    --bg:#FFF8EF;            /* 따뜻한 크림 */
    --ink:#221F3D;           /* 짙은 남보라 잉크 */
    --sub:#5B5E85;
    --dim:#6C6F95;
    --line:#EEE7F7;          /* 연한 테두리 */
    --line2:#E4DAF5;         /* 카드 테두리 */
    --surface:#FFFFFF;
    --teal:#00C2A8;          /* 민트 — 주 색 */
    --teal-ink:#046A5E;      /* 글자용 진한 민트 */
    --teal-deep:#00A18C;     /* 도톰한 그림자용 */
    --indigo:#7C5CFC;        /* 바이올렛 — 보조 */
    --indigo-ink:#5B37EE;
    --gold:#F0A020;          /* 햇살 노랑 */
    --ok:#12B76A;
    --ok-deep:#0E9457;
    --no:#FF5B5B;
    --no-deep:#E03E3E;
    --appvh:100vh;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{overflow-x:hidden;overscroll-behavior:none}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;
    min-height:100vh;min-height:var(--appvh);
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(52% 30% at 88% -4%, rgba(0,194,168,.26), transparent 68%),
      radial-gradient(46% 28% at 4% 6%, rgba(124,92,252,.20), transparent 70%),
      radial-gradient(58% 34% at 46% 106%, rgba(240,160,32,.22), transparent 72%);
  }
  #app{
    position:relative;z-index:1;width:100%;max-width:460px;
    padding:calc(18px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;min-height:100vh;min-height:var(--appvh);
  }
  .screen{display:none;flex:1;flex-direction:column}
  .screen.on{display:flex;animation:fade .45s var(--ease)}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ─────────── 시작 화면 ─────────── */
  /* 화면이 충분히 길 때만 가운데 정렬 — 낮은 인앱 브라우저 화면에서 위가 잘리지 않게 */
  @media (min-height:700px){ #s-start,#s-done{justify-content:center} }
  .kicker{
    display:inline-flex;align-items:center;gap:8px;align-self:flex-start;
    font-size:.7rem;letter-spacing:.2em;font-weight:800;color:var(--teal-ink);
    border:2px solid rgba(0,194,168,.4);background:rgba(0,194,168,.12);
    padding:7px 13px;border-radius:99px;margin-bottom:20px;
  }
  .kicker i{width:6px;height:6px;border-radius:99px;background:var(--teal);font-style:normal;
    box-shadow:0 0 10px var(--teal);animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  h1{font-size:clamp(2rem,9.5vw,2.6rem);font-weight:800;line-height:1.18;letter-spacing:-.03em}
  h1 em{font-style:normal;background:linear-gradient(100deg,var(--teal),var(--indigo));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .lede{color:var(--sub);font-size:.92rem;margin:13px 0 4px;line-height:1.7}
  .lede b{color:var(--ink);font-weight:600}

  .label{font-size:.7rem;color:var(--dim);letter-spacing:.16em;font-weight:800;margin:22px 0 9px}
  .chips{display:flex;gap:8px}
  .chip{
    flex:1;min-width:0;padding:13px 4px;border-radius:16px;border:2px solid var(--line2);
    background:var(--surface);color:var(--sub);font-size:.92rem;font-weight:700;
    text-align:center;cursor:pointer;font-family:inherit;letter-spacing:-.02em;
    box-shadow:0 3px 0 var(--line2);
    transition:border-color .18s,background .18s,color .18s,transform .12s,box-shadow .12s;
  }
  .chip small{display:block;font-weight:600;color:var(--dim);font-size:.67rem;margin-top:4px;letter-spacing:0}
  .chip.sel{border-color:var(--teal);background:#E4FAF6;color:var(--teal-ink);box-shadow:0 3px 0 var(--teal)}
  .chip.sel small{color:var(--teal-ink);opacity:.75}
  .chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line2)}
  .chip.sel:active{box-shadow:0 1px 0 var(--teal)}
  #mode-chips .chip{font-size:.85rem}
  #mode-chips .chip small{font-size:.63rem}

  .go{
    margin-top:26px;padding:19px;border:none;border-radius:18px;width:100%;
    background:linear-gradient(100deg,var(--teal),#4FD6C0 55%,#5BD2F0);color:var(--ink);
    font-size:1.06rem;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:-.01em;
    box-shadow:0 5px 0 var(--teal-deep), 0 14px 26px -12px rgba(0,162,140,.55);
    transition:transform .1s,box-shadow .1s;
  }
  .go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--teal-deep)}
  .go.ghost{background:var(--surface);color:var(--sub);border:2px solid var(--line2);
    box-shadow:0 4px 0 var(--line2)}
  .go.ghost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line2)}
  .foot{margin-top:16px;text-align:center;font-size:.73rem;color:var(--dim);line-height:1.7}

  /* ─────────── 퀴즈 화면 ─────────── */
  .top{display:flex;align-items:center;gap:13px;margin-bottom:13px}
  .quit{background:none;border:none;color:var(--dim);font-size:1.25rem;cursor:pointer;
    padding:2px 6px;line-height:1;font-family:inherit}
  .bar{flex:1;height:7px;background:#EDE6F8;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,var(--teal),var(--indigo));transition:width .4s var(--ease)}
  .count{font-size:.78rem;color:var(--dim);font-variant-numeric:tabular-nums;
    font-weight:700;min-width:46px;text-align:right}

  .meta-row{display:flex;align-items:center;justify-content:center;gap:8px;
    min-height:20px;margin-bottom:11px;flex-wrap:wrap}
  .tag{font-size:.68rem;font-weight:800;letter-spacing:.03em;padding:4px 11px;border-radius:99px;
    border:2px solid transparent}
  .tag.round{color:#B36A00;border-color:rgba(240,160,32,.45);background:#FFF3DC}
  .tag.streak{color:var(--ok-deep);border-color:rgba(18,183,106,.4);background:#E4F9EE}

  .stack{position:relative;flex:1;min-height:290px;margin-bottom:15px}
  .card{
    position:absolute;inset:0;border-radius:26px;
    background:#FFFFFF;
    border:2px solid var(--line2);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:26px 22px;
    box-shadow:0 7px 0 var(--line2), 0 20px 34px -20px rgba(34,31,61,.35);
  }
  .card.peek2{transform:scale(.9) translateY(22px);background:#FFF4E2;border-color:#F3DFBC;
    box-shadow:none;z-index:0}
  .card.peek1{transform:scale(.95) translateY(11px);background:#F3EEFF;border-color:#DDD1FA;
    box-shadow:none;z-index:1}
  .card.front{z-index:2;cursor:pointer;touch-action:pan-y;will-change:transform}
  .card.front.settle{transition:transform .38s var(--ease),opacity .3s}
  .card.front.in{animation:cardIn .38s var(--ease)}
  @keyframes cardIn{from{opacity:0;transform:scale(.94) translateY(16px)}to{opacity:1;transform:none}}
  /* 뜻을 펼치면 내용이 길어질 수 있으니 카드 안에서 스크롤 */
  .card.open{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .card.open::-webkit-scrollbar{width:0}

  .num{font-size:.7rem;color:var(--dim);letter-spacing:.14em;font-weight:700;margin-bottom:14px;flex-shrink:0}
  .card.open .num{margin-top:2px}
  .word{font-size:clamp(2rem,9vw,2.7rem);font-weight:800;letter-spacing:-.025em;
    word-break:break-word;line-height:1.15;flex-shrink:0}
  .word.ko{font-size:clamp(1.28rem,5.9vw,1.6rem);line-height:1.5;letter-spacing:-.01em}
  /* 문장 빈칸 모드 앞면 */
  .word.sent{font-size:clamp(1.06rem,4.8vw,1.28rem);line-height:1.75;font-weight:600;
    letter-spacing:-.005em;text-align:left;width:100%}
  .blank{display:inline-block;min-width:92px;border-bottom:3px solid var(--teal);
    background:rgba(0,194,168,.1);border-radius:4px 4px 0 0;
    vertical-align:baseline;height:1.1em}
  .word.sent mark{background:#D6F7F0;color:var(--teal-ink);font-weight:800;
    border-radius:6px;padding:1px 5px;animation:fillIn .4s var(--ease)}
  @keyframes fillIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  #c-answer .word{font-size:clamp(1.7rem,7.5vw,2.1rem);margin-top:13px}

  /* ── 발음 ── */
  .pron{display:flex;align-items:center;justify-content:center;gap:9px;
    margin-top:9px;flex-wrap:wrap}
  .pron:empty{display:none}
  .ipa{font-size:.88rem;color:var(--sub);font-weight:600;letter-spacing:.01em}
  .spk{
    flex-shrink:0;width:34px;height:34px;border-radius:99px;cursor:pointer;
    border:2px solid var(--teal);background:#E4FAF6;color:var(--teal-ink);
    display:inline-flex;align-items:center;justify-content:center;padding:0;
    box-shadow:0 3px 0 var(--teal);transition:transform .1s,box-shadow .1s;
  }
  .spk svg{width:16px;height:16px;fill:currentColor}
  .spk:active{transform:translateY(2px);box-shadow:0 1px 0 var(--teal)}
  .spk.sm{width:32px;height:32px;box-shadow:0 2px 0 var(--teal)}
  .spk.sm svg{width:14px;height:14px}
  .spk.sm:active{transform:translateY(1px);box-shadow:0 1px 0 var(--teal)}
  .ex + .ex .spk{border-color:var(--indigo);background:#F2EEFF;color:var(--indigo-ink);
    box-shadow:0 2px 0 var(--indigo)}
  .ex + .ex .spk:active{box-shadow:0 1px 0 var(--indigo)}
  .spk.playing{animation:speaking .7s ease-in-out infinite}
  @keyframes speaking{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  body.no-tts .spk{display:none}
  .sent-ko{display:none;margin-top:16px;font-size:.86rem;color:var(--sub);line-height:1.6;
    text-align:left;width:100%;padding-top:14px;border-top:1px solid var(--line)}
  .sent-ko.on{display:block}

  .hint{margin-top:22px;font-size:.8rem;color:var(--dim);display:flex;align-items:center;gap:7px;flex-shrink:0}
  .hint svg{width:15px;height:15px;stroke:var(--teal);fill:none;stroke-width:1.8;
    animation:tapping 2s var(--ease) infinite}
  @keyframes tapping{0%,70%,100%{transform:translateY(0)}82%{transform:translateY(-4px)}}

  .reveal{display:none;width:100%;animation:fade .3s var(--ease)}
  .card.open .hint{display:none}
  .card.open .sent-ko{display:none}
  .card.open .reveal{display:block}
  .pos{display:inline-block;font-size:.68rem;font-weight:800;color:var(--teal-ink);
    background:#E4FAF6;border:2px solid rgba(0,194,168,.35);
    border-radius:99px;padding:3px 11px;margin:14px 0 8px}
  .mean{font-size:1.08rem;font-weight:700;line-height:1.55;letter-spacing:-.01em}
  .rel{font-size:.78rem;color:var(--dim);margin-top:8px}
  .ex-label{font-size:.62rem;letter-spacing:.16em;font-weight:800;color:var(--dim);
    text-align:left;margin:15px 0 7px}
  .ex{padding:14px 15px;border-radius:15px;
    background:#E9FBF7;border:2px solid rgba(0,194,168,.28);text-align:left}
  .ex + .ex{margin-top:9px;background:#F2EEFF;border-color:rgba(124,92,252,.3)}
  .ex{display:flex;gap:10px;align-items:flex-start}
  .ex-body{flex:1;min-width:0}
  .ex-en{font-size:.93rem;line-height:1.6}
  .ex-en mark{background:none;color:var(--teal-ink);font-weight:800}
  .ex + .ex .ex-en mark{color:var(--indigo-ink)}
  .ex-ko{font-size:.81rem;color:var(--sub);margin-top:6px;line-height:1.55}

  /* 카드 안에 더 볼 내용이 남아 있을 때 알려주는 표시 */
  .more-hint{
    position:absolute;left:1px;right:1px;bottom:1px;z-index:3;pointer-events:none;
    padding:26px 0 12px;text-align:center;font-size:.72rem;font-weight:800;color:var(--teal-ink);
    border-radius:0 0 24px 24px;opacity:0;transition:opacity .25s;
    background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,255,255,.96) 55%);
  }
  .more-hint.on{opacity:1}
  /* 낮은 화면에서는 여백을 줄여 두 예문이 최대한 한눈에 들어오게 */
  @media (max-height:680px){
    .card.open{padding:20px 18px}
    .ex-label{margin:13px 0 7px}
    #c-answer .word{margin-top:12px}
    .card.open .num{margin-bottom:10px}
  }

  .stamp{
    position:absolute;top:24px;font-size:1.5rem;font-weight:900;letter-spacing:.06em;
    padding:7px 15px;border-radius:14px;border:4px solid;opacity:0;pointer-events:none;z-index:3;
    background:#FFFFFF;
  }
  .stamp.y{right:22px;color:var(--ok-deep);border-color:var(--ok);transform:rotate(11deg)}
  .stamp.n{left:22px;color:var(--no-deep);border-color:var(--no);transform:rotate(-11deg)}

  .ox{display:flex;gap:11px}
  .ox button{
    flex:1;padding:17px;border-radius:18px;font-size:1.02rem;font-weight:800;
    cursor:pointer;font-family:inherit;letter-spacing:-.01em;
    transition:transform .1s,box-shadow .1s;
  }
  .ox .no{background:#FFECEC;color:var(--no-deep);border:2px solid var(--no);box-shadow:0 4px 0 var(--no)}
  .ox .ok{background:#E4F9EE;color:var(--ok-deep);border:2px solid var(--ok);box-shadow:0 4px 0 var(--ok)}
  .ox .no:active{transform:translateY(2px);box-shadow:0 2px 0 var(--no)}
  .ox .ok:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ok)}

  /* ─────────── 결과 화면 ─────────── */
  .ring-wrap{position:relative;width:164px;height:164px;margin:0 auto 18px;flex-shrink:0}
  .ring-wrap svg{transform:rotate(-90deg)}
  .ring-bg{fill:none;stroke:#EDE6F8;stroke-width:9}
  .ring-fg{fill:none;stroke:url(#rg);stroke-width:9;stroke-linecap:round;
    transition:stroke-dashoffset 1.1s var(--ease)}
  .ring-mid{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center}
  .ring-pct{font-size:2.4rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .ring-cap{font-size:.72rem;color:var(--dim);letter-spacing:.1em;font-weight:700;margin-top:2px}
  .score{text-align:center;font-size:1rem;font-weight:700;color:var(--sub)}
  .score b{color:var(--ink)}
  .sub-msg{text-align:center;color:var(--sub);font-size:.88rem;margin:11px 0 20px;line-height:1.7}

  .miss-box{background:var(--surface);border:2px solid var(--line2);border-radius:20px;
    box-shadow:0 5px 0 var(--line2);
    padding:15px 17px;max-height:32vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .miss-box h3{font-size:.68rem;color:#B36A00;letter-spacing:.14em;font-weight:800;margin-bottom:11px}
  .miss{padding:9px 0;border-bottom:1px solid var(--line)}
  .miss:last-child{border-bottom:none}
  .miss-top{display:flex;justify-content:space-between;gap:12px;font-size:.9rem}
  .miss-top b{font-weight:700;letter-spacing:-.01em}
  .miss-top span{color:var(--sub);text-align:right;font-size:.81rem;line-height:1.45}
  .miss-ex{font-size:.76rem;color:var(--dim);margin-top:5px;line-height:1.5}
  .miss-ex mark{background:none;color:var(--teal-ink);font-weight:800}
  .btn-row{display:flex;gap:10px;margin-top:18px}
  .btn-row .go{margin-top:0}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media print{
    body::before{display:none}
    body{background:#fff;color:#000}
    .ox,.go,.quit,.top,.spk{display:none}
    @page{margin:15mm}
  }
</style>
</head>
<body>
<div id="app">

  <!-- 시작 -->
  <section class="screen on" id="s-start">
    <div class="kicker"><i></i>VOCA SWIPE</div>
    <h1>단어 하나에<br>문장 <em>둘.</em></h1>
    <p class="lede">
      뜻만 외우면 아는 것 같기만 합니다. 쓰임이 다른 <b>예문 두 개</b>로 확인하고,<br>
      <b>발음기호와 듣기</b>로 소리까지, <b>문장 빈칸</b> 모드로 활용까지 익히세요.
    </p>

    <div class="label">범위</div>
    <div class="chips" id="day-chips">
      <button class="chip sel" data-day="37">Day 37<small>40단어</small></button>
      <button class="chip" data-day="38">Day 38<small>40단어</small></button>
      <button class="chip" data-day="all">전체<small>80단어</small></button>
    </div>

    <div class="label">방식</div>
    <div class="chips" id="mode-chips">
      <button class="chip sel" data-mode="en2ko">영 → 한<small>평소 회독</small></button>
      <button class="chip" data-mode="ko2en">한 → 영<small>시험 직전</small></button>
      <button class="chip" data-mode="sent">문장 빈칸<small>활용 연습</small></button>
    </div>

    <button class="go" id="btn-start">시작하기</button>
    <p class="foot">Day 37 · 1441–1480 &nbsp;|&nbsp; Day 38 · 1481–1520 &nbsp;|&nbsp; 예문 160개<br>
      발음기호는 Cambridge Dictionary 미국 발음</p>
  </section>

  <!-- 퀴즈 -->
  <section class="screen" id="s-quiz">
    <div class="top">
      <button class="quit" id="btn-quit" aria-label="그만하기">✕</button>
      <div class="bar"><i id="bar-fill"></i></div>
      <div class="count" id="count">0 / 0</div>
    </div>
    <div class="meta-row" id="meta-row"></div>
    <div class="stack">
      <div class="card peek2"></div>
      <div class="card peek1"></div>
      <div class="more-hint" id="more-hint">▾ 예문이 더 있어요</div>
      <div class="card front" id="card">
        <div class="stamp y">알아요</div>
        <div class="stamp n">몰라요</div>
        <div class="num" id="c-num"></div>
        <div class="word" id="c-word"></div>
        <div class="pron" id="c-pron"></div>

/* 인앱 브라우저(카톡 등)에서 툴바 때문에 화면 높이가 틀어지는 것을 보정 */
function fixVH(){document.documentElement.style.setProperty('--appvh',window.innerHeight+'px');}
fixVH();window.addEventListener('resize',fixVH);window.addEventListener('orientationchange',fixVH);

let day="37", mode="en2ko";
let queue=[], total=0, idx=0, round=1, missed=[], knownFirstTry=0, streak=0, locked=false;

const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buzz(ms){if(navigator.vibrate){try{navigator.vibrate(ms);}catch(e){}}}

/* ── 소리 내어 읽기 (기기 내장 음성 — 따로 받을 파일이 없다) ── */
const TTS = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance==='function';
if(!TTS) document.body.classList.add('no-tts');
const SPK_ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 2v2a8 8 0 0 1 0 16v2a10 10 0 0 0 0-20z"/></svg>';
function plain(html){return html.replace(/<[^>]+>/g,'');}
function say(text,btn,rate){
  if(!TTS||!text)return;
  try{
    speechSynthesis.cancel();
    document.querySelectorAll('.spk.playing').forEach(b=>b.classList.remove('playing'));
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=rate||.85;
    const vs=speechSynthesis.getVoices()||[];
    const v=vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));
    if(v)u.voice=v;
    if(btn){btn.classList.add('playing');
      u.onend=u.onerror=()=>btn.classList.remove('playing');}
    speechSynthesis.speak(u);
  }catch(e){}
}
function stopSay(){if(TTS){try{speechSynthesis.cancel();}catch(e){}}
  document.querySelectorAll('.spk.playing').forEach(b=>b.classList.remove('playing'));}
/* 발음 줄 만들기: 발음기호 + 듣기 단추 */
function pronRow(el,word){
  el.innerHTML='<span class="ipa">'+(IPA[word]||'')+'</span>'+
               '<button class="spk" aria-label="'+word+' 발음 듣기">'+SPK_ICON+'</button>';
  const b=el.querySelector('.spk');
  b.onclick=e=>{e.stopPropagation();say(word,b,.8);};
}
/* 예문에서 표제어만 빈칸으로 */
function blankOut(html){return html.replace(/<mark>[\s\S]*?<\/mark>/,'<span class="blank"></span>');}

function chipify(boxId,cb){
  $(boxId).addEventListener('click',e=>{
    const b=e.target.closest('.chip'); if(!b)return;
    $(boxId).querySelectorAll('.chip').forEach(c=>c.classList.remove('sel'));
    b.classList.add('sel'); cb(b.dataset);
  });
}
chipify('day-chips',d=>day=d.day);
chipify('mode-chips',d=>mode=d.mode);

function startQuiz(list){
  queue=[...list];total=queue.length;idx=0;round=1;missed=[];knownFirstTry=0;streak=0;locked=false;
  show('s-quiz');render();
}
$('btn-start').onclick=()=>{
  const list = day==="all" ? DATA : DATA.filter(w=>String(w[1])===day);
  startQuiz(shuffle(list));
};
$('btn-quit').onclick=()=>{stopSay();show('s-start');};

function render(){
  const w=queue[idx],card=$('card');
  card.className='card front in';
  card.style.transform='';card.style.opacity='';card.scrollTop=0;
  setStamp(0);$('more-hint').classList.remove('on');stopSay();
  $('c-num').textContent='No.'+w[0]+' · DAY '+w[1];
  $('c-sentko').classList.remove('on');
  $('c-answer').innerHTML='';
  $('c-pron').innerHTML='';$('c-pron2').innerHTML='';

  if(mode==='en2ko'){
    $('c-word').textContent=w[2];$('c-word').className='word';
    $('c-mean').textContent=w[4];
    pronRow($('c-pron'),w[2]);          // 앞면에 발음기호·듣기
    $('c-hint').textContent='탭하면 뜻과 예문이 보여요';
  }else if(mode==='ko2en'){
    $('c-word').textContent=w[4];$('c-word').className='word ko';
    $('c-mean').textContent=w[4];
    $('c-answer').innerHTML='<div class="word">'+w[2]+'</div>';  // 답을 열면 단어가 크게
    $('c-hint').textContent='탭하면 단어와 예문이 보여요';
  }else{ // 문장 빈칸 — 회차마다 다른 문장으로
    const useSecond = round>1;
    const en = useSecond ? w[8] : w[6];
    const ko = useSecond ? w[9] : w[7];
    $('c-word').innerHTML=blankOut(en);$('c-word').className='word sent';
    $('c-sentko').textContent=ko;$('c-sentko').classList.add('on');
    $('c-mean').textContent=w[4];
    $('c-answer').innerHTML='<div class="word">'+w[2]+'</div>';
    $('c-hint').textContent='빈칸에 들어갈 단어는? 탭하면 답이 보여요';
  }

  $('c-pos').textContent=w[3];
  $('c-rel').textContent=w[5];$('c-rel').style.display=w[5]?'block':'none';
  $('c-ex').innerHTML=w[6];$('c-exko').textContent=w[7];
  $('c-ex2').innerHTML=w[8];$('c-exko2').textContent=w[9];
  $('count').textContent=(idx+1)+' / '+queue.length;
  $('bar-fill').style.width=(idx/queue.length*100)+'%';

  let meta='';
  if(round>1) meta+='<span class="tag round">'+round+'회차 · 몰랐던 것만</span>';
  if(streak>=3) meta+='<span class="tag streak">연속 '+streak+'개</span>';
  $('meta-row').innerHTML=meta;
  locked=false;
}

/* ── 탭해서 답 보기 + 밀어서 O/X ── */
const card=$('card');
let dragging=false,startX=0,startY=0,dx=0,moved=false,startT=0;

function setStamp(v){
  card.querySelector('.stamp.y').style.opacity = v>0 ? Math.min(1,v) : 0;
  card.querySelector('.stamp.n').style.opacity = v<0 ? Math.min(1,-v) : 0;
}
function pt(e){const t=e.touches?e.touches[0]:e;return{x:t.clientX,y:t.clientY};}
/* 답 펼치기 — 문장 모드에서는 빈칸을 정답으로 채워 문장을 완성한다 */
function reveal(){
  const w=queue[idx];
  if(mode==='sent'){
    const b=card.querySelector('.blank');
    if(b){const m=document.createElement('mark');m.textContent=w[2];b.replaceWith(m);}
  }
  if(mode!=='en2ko' && !$('c-pron2').innerHTML) pronRow($('c-pron2'),w[2]); // 답을 연 뒤에 발음
  card.classList.add('open');
  updateMoreHint();
}
/* 카드 안에 아직 안 보인 내용이 남았으면 '더 있어요'를 띄운다 */
function updateMoreHint(){
  const more = card.classList.contains('open') &&
               card.scrollHeight - card.clientHeight - card.scrollTop > 8;
  $('more-hint').classList.toggle('on',more);
}
card.addEventListener('scroll',updateMoreHint,{passive:true});
window.addEventListener('resize',updateMoreHint);

/* 예문 듣기 단추 — 문장을 통째로 읽어 준다 */
[['spk-ex1',6],['spk-ex2',8]].forEach(([id,i])=>{
  const b=$(id); b.innerHTML=SPK_ICON;
  b.onclick=e=>{e.stopPropagation();say(plain(queue[idx][i]),b,.8);};
});

function down(e){
  if(locked)return;
  if(e.target.closest && e.target.closest('.spk'))return;   // 듣기 단추는 카드를 넘기지 않는다
  const p=pt(e);dragging=true;moved=false;dx=0;startX=p.x;startY=p.y;startT=Date.now();
  card.classList.remove('settle','in');
}
function move(e){
  if(!dragging||locked)return;
  const p=pt(e);const ddx=p.x-startX, ddy=p.y-startY;
  if(!moved && Math.abs(ddx)<8 && Math.abs(ddy)<8) return;
  if(!moved && Math.abs(ddy)>Math.abs(ddx)*1.6){dragging=false;return;} // 세로 제스처(스크롤)는 넘긴다
  moved=true;dx=ddx;
  if(e.cancelable)e.preventDefault();
  card.style.transform='translateX('+dx+'px) rotate('+(dx/22)+'deg)';
  setStamp(dx/110);
}
function up(){
  if(!dragging||locked)return;dragging=false;
  const quick=Date.now()-startT<300;
  if(!moved){ reveal(); return; }
  if(Math.abs(dx)>96 || (quick && Math.abs(dx)>56)){ answer(dx>0); return; }
  card.classList.add('settle');card.style.transform='';setStamp(0);
}
card.addEventListener('touchstart',down,{passive:true});
card.addEventListener('touchmove',move,{passive:false});
card.addEventListener('touchend',up);
card.addEventListener('touchcancel',up);
card.addEventListener('mousedown',down);
window.addEventListener('mousemove',move);
window.addEventListener('mouseup',up);

function answer(known){
  if(locked)return;locked=true;
  const w=queue[idx];
  if(!known){missed.push(w);streak=0;buzz(18);}
  else{if(round===1)knownFirstTry++;streak++;buzz(9);}
  setStamp(known?1:-1);
  card.classList.add('settle');
  card.style.transform='translateX('+(known?1:-1)*window.innerWidth*1.2+'px) rotate('+(known?16:-16)+'deg)';
  card.style.opacity='0';
  setTimeout(next,230);
}
$('btn-ok').onclick=()=>answer(true);
$('btn-no').onclick=()=>answer(false);

function next(){
  idx++;
  if(idx<queue.length){render();return;}
  if(missed.length>0 && round<3){round++;queue=shuffle(missed);missed=[];idx=0;streak=0;render();return;}
  finish();
}

function finish(){
  stopSay();
  $('bar-fill').style.width='100%';
  const rate=total?Math.round(knownFirstTry/total*100):0;
  $('d-score').innerHTML='첫 시도 <b>'+knownFirstTry+'</b> / '+total+' 단어';
  $('d-msg').textContent = missed.length===0
    ? '전부 통과. 오늘 회독은 여기서 끝. 내일 한 번만 더 돌리면 완성이야.'
    : '아래 '+missed.length+'개는 뜻이 아니라 문장째로 세 번 읽고 끝내자.';

  const box=$('d-miss');box.innerHTML='';
  if(missed.length===0){$('d-missbox').style.display='none';$('btn-retry').style.display='none';}
  else{
    $('d-missbox').style.display='block';$('btn-retry').style.display='block';
    missed.forEach(w=>{
      const div=document.createElement('div');div.className='miss';
      div.innerHTML='<div class="miss-top"><b>'+w[2]+'</b><span>'+w[4]+'</span></div>'+
                    '<div class="miss-ex">'+w[6]+'</div>';
      box.appendChild(div);
    });
  }
  show('s-done');

  const C=452.4;
  $('ring').style.strokeDashoffset=C;
  $('d-pct').textContent='0%';
  setTimeout(()=>{$('ring').style.strokeDashoffset=C*(1-rate/100);},80);
  let n=0;const step=Math.max(1,Math.round(rate/28));
  const t=setInterval(()=>{n+=step;if(n>=rate){n=rate;clearInterval(t);}$('d-pct').textContent=n+'%';},34);
}
$('btn-home').onclick=()=>{stopSay();show('s-start');};
/* 기기 음성 목록은 늦게 오는 일이 있어 한 번 깨워 둔다 */
if(TTS){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{};}catch(e){}}
$('btn-retry').onclick=()=>{if(missed.length)startQuiz(shuffle(missed));};
</script>
