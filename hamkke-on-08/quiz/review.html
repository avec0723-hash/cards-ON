<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F2EDE4;
    --card: #FBF8F2;
    --ink: #1B2A2E;
    --ink-soft: #4C5D62;
    --ink-faint: #8D999B;
    --deep: #12262E;
    --deep-card: #1B3540;
    --teal: #7FD4D8;
    --teal-ink: #2C757F;
    --teal-soft: #B9E5E7;
    --coral: #E8785A;
    --coral-deep: #D45C3D;
    --rule: #D7CFC1;
    --sans: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    --serif: "Nanum Myeongjo", "Noto Serif KR", "Batang", serif;
    --shadow: 0 10px 40px rgba(18, 38, 46, 0.16);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 12% 18%, rgba(127,212,216,0.10) 0, transparent 30%),
      radial-gradient(circle at 88% 82%, rgba(232,120,90,0.08) 0, transparent 35%);
    pointer-events: none;
  }
  .stage {
    width: 100%;
    max-width: 880px;
    position: relative;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--rule);
    border-top: 4px solid var(--coral);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 56px 60px 48px;
    display: none;
    animation: rise .45s ease both;
  }
  .card.active { display: block; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── 표지 ── */
  .cover { text-align: center; padding: 72px 60px; background: var(--deep); color: var(--paper); border-top-color: var(--teal); }
  .cover .school {
    display: inline-block;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 5px;
    color: var(--deep);
    background: var(--teal);
    padding: 6px 14px 5px 19px;
    margin-bottom: 26px;
  }
  .cover .layer {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-size: 15px;
    letter-spacing: 4px;
    color: var(--coral);
    margin-bottom: 10px;
  }
  .cover .layer .nn { font-size: 34px; letter-spacing: 0; }
  .cover h1 {
    font-size: 44px;
    font-weight: 900;
    color: var(--paper);
    letter-spacing: -0.5px;
    line-height: 1.3;
    margin-bottom: 14px;
  }
  .cover h1 .em { color: var(--teal); }
  .cover .sub {
    font-size: 17px;
    color: rgba(242,237,228,0.8);
    margin-bottom: 40px;
  }
  .ornament {
    display: flex; align-items: center; justify-content: center;
    gap: 14px; margin: 28px 0 36px;
    color: var(--coral);
    font-size: 14px;
  }
  .ornament::before, .ornament::after {
    content: '';
    width: 90px; height: 1px;
    background: linear-gradient(to right, transparent, rgba(232,120,90,0.7));
  }
  .ornament::after { background: linear-gradient(to left, transparent, rgba(232,120,90,0.7)); }
  .rules {
    display: inline-block;
    text-align: left;
    background: var(--deep-card);
    border: 1px solid rgba(127,212,216,0.25);
    border-radius: 12px;
    padding: 22px 32px;
    font-size: 15.5px;
    color: rgba(242,237,228,0.88);
    margin-bottom: 42px;
  }
  .rules li { list-style: none; padding: 3px 0; }
  .rules li::before { content: '· '; color: var(--teal); font-weight: 700; }

  /* ── 문제 ── */
  .qhead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 26px;
  }
  .qnum {
    font-size: 15px;
    letter-spacing: 3px;
    color: var(--teal-ink);
    font-weight: 700;
  }
  .qnum b { font-size: 26px; color: var(--coral-deep); letter-spacing: 0; }
  .qcat {
    font-size: 13.5px;
    font-weight: 700;
    color: #fff;
    background: var(--teal-ink);
    padding: 5px 16px;
    border-radius: 999px;
    letter-spacing: 1px;
  }
  .qtext {
    font-size: 27px;
    font-weight: 900;
    color: var(--ink);
    line-height: 1.55;
    margin-bottom: 34px;
    word-break: keep-all;
  }
  .qtext .em { color: var(--coral-deep); }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 30px; }
  .choice {
    border: 1.5px solid var(--rule);
    border-radius: 12px;
    padding: 17px 22px;
    font-size: 19px;
    background: #fff;
    transition: all .35s ease;
    display: flex;
    align-items: center;
    gap: 14px;
    word-break: keep-all;
    cursor: pointer;
  }
  .choices:not(.revealed) .choice:hover {
    border-color: var(--teal-ink);
    transform: translateY(-1px);
  }
  .revealed .choice { cursor: default; }
  .choice .tag {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1.5px solid var(--teal-ink);
    color: var(--teal-ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    font-weight: 700;
  }
  .revealed .choice { opacity: 0.35; cursor: default; }
  .revealed .choice.correct {
    opacity: 1;
    background: var(--teal-ink);
    border-color: var(--teal-ink);
    color: #fff;
    transform: scale(1.03);
    box-shadow: 0 8px 24px rgba(44,117,127,0.35);
  }
  .revealed .choice.correct .tag {
    background: var(--teal);
    border-color: var(--teal);
    color: var(--deep);
  }
  .revealed .choice.wrongpick {
    opacity: 1;
    background: var(--coral);
    border-color: var(--coral);
    color: #fff;
  }
  .revealed .choice.wrongpick .tag {
    background: #fff;
    border-color: #fff;
    color: var(--coral-deep);
  }
  .revealed .choice.wrongpick .tag::after { content: ''; }
  .aha {
    display: none;
    font-family: var(--serif);
    background: rgba(127,212,216,0.22);
    border-left: 4px solid var(--coral);
    border-radius: 0 12px 12px 0;
    padding: 22px 28px;
    font-size: 17px;
    color: var(--ink);
    line-height: 1.8;
    margin-bottom: 30px;
    animation: rise .4s ease both;
    word-break: keep-all;
  }
  .aha.show { display: block; }
  .aha .label {
    font-family: var(--sans);
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--teal-ink);
    font-weight: 900;
    display: block;
    margin-bottom: 8px;
  }

  /* ── 버튼·진행 ── */
  .controls { display: flex; justify-content: space-between; align-items: center; }
  .btn {
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    padding: 13px 36px;
    border-radius: 999px;
    border: 1.5px solid var(--deep);
    background: var(--deep);
    color: var(--paper);
    cursor: pointer;
    letter-spacing: 1px;
    transition: all .25s ease;
  }
  .btn:hover { background: var(--deep-card); transform: translateY(-1px); }
  .btn.ghost { background: transparent; color: var(--deep); }
  .btn.ghost:hover { background: rgba(18,38,46,0.06); }
  .btn.coral { background: var(--coral); border-color: var(--coral); color: #fff; }
  .btn.coral:hover { background: var(--coral-deep); }
  .dots { display: flex; gap: 8px; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: rgba(18,38,46,0.15);
    transition: all .3s ease;
  }
  .dot.on { background: var(--coral); transform: scale(1.25); }
  .dot.done { background: var(--teal-ink); }
  .hint {
    text-align: center;
    font-size: 13px;
    color: var(--ink-faint);
    margin-top: 18px;
    letter-spacing: 1px;
  }
  .cover .hint { color: rgba(242,237,228,0.5); }

  /* ── 마무리 ── */
  .finale { text-align: center; padding: 64px 60px; }
  .finale .school {
    display: inline-block;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #fff;
    background: var(--teal-ink);
    padding: 5px 12px 4px 17px;
    margin-bottom: 20px;
  }
  .finale h2 {
    font-size: 38px;
    font-weight: 900;
    color: var(--deep);
    margin-bottom: 12px;
    letter-spacing: -0.5px;
  }
  .finale .msg { font-size: 18px; color: var(--ink-soft); margin-bottom: 40px; }
  .recap {
    text-align: left;
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 28px 36px;
    margin-bottom: 36px;
  }
  .recap h3 {
    font-size: 15px; letter-spacing: 3px; font-weight: 900;
    color: var(--teal-ink); margin-bottom: 16px;
    text-align: center;
  }
  .recap table { width: 100%; border-collapse: collapse; font-size: 16px; }
  .recap td { padding: 7px 8px; border-bottom: 1px dashed var(--rule); vertical-align: top; }
  .recap tr:last-child td { border-bottom: none; }
  .recap .no { color: var(--coral-deep); font-weight: 900; width: 34px; }
  .recap .ans { color: var(--deep); font-weight: 700; white-space: nowrap; padding-left: 14px; }
  .recap .ox { width: 30px; font-weight: 900; text-align: center; }
  .recap .ox.o { color: var(--teal-ink); }
  .recap .ox.x { color: var(--coral-deep); }
  .recap .ox.n { color: var(--ink-faint); font-weight: 400; }

  @media (max-width: 640px) {
    .card { padding: 36px 26px; }
    .cover h1 { font-size: 30px; }
    .qtext { font-size: 21px; }
    .choices { grid-template-columns: 1fr; }
    .choice { font-size: 17px; }
    .recap .ans { white-space: normal; }
  }
</style>
</head>
<body>
<div class="stage">

  <!-- 표지 -->
  <section class="card cover active" id="cover">
    <div class="school">함께읽기 O N</div>

    <p class="sub">여덟 층을 한 바퀴 — 각 장에서 하나씩 골라낸 열 문제</p>

    <div>
      <button class="btn coral" onclick="start()">start</button>

  <!-- 문제 카드 (스크립트가 채움) -->
  <section class="card" id="quiz">
    <div class="qhead">
      <div class="qnum">문제 <b id="qNo">1</b> / 10</div>

  </section>

</div>

<script>
const QUESTIONS = [
  {
    cat: "1장 · 가속",
    q: "연못의 수련이 매일 두 배로 자라, 30일째 되는 날 연못을 가득 덮습니다. 그렇다면 <span class=\"em\">29일째</span>, 연못은 얼마나 덮여 있었을까요?",
    choices: ["10분의 1","4분의 1","절반","거의 다 (90%)"],
    answer: 2,
    aha: "겨우 절반입니다. 마지막 하루 전까지도 \"아직 반이나 남았네\" 하고 여유를 부리게 되는 것 — 이것이 기하급수 앞에 선 인간의 직관입니다. 커즈와일은 우리의 직관이 선형(직선)으로만 미래를 그린다고 말합니다. 99도의 물과 100도의 물은 단 1도 차이지만, 그 1도에서 끓기 시작합니다.",
    short: "절반 (마지막 하루에 2배)"
  },
  {
    cat: "1장 · 가속",
    q: "커즈와일이 1999년부터 지금까지 <span class=\"em\">한 번도 바꾸지 않은 예측</span> — AI가 튜링 테스트(사람과 구별할 수 없는 대화 시험)를 통과하는 해는 언제일까요?",
    choices: ["2029년","2039년","2045년","2099년"],
    answer: 0,
    aha: "2029년입니다. 1999년 책에서 처음 내놓은 뒤 25년 넘게 고치지 않은 숫자입니다. 그리고 2045년은 또 다른 해 — 인간의 마음이 수백만 배로 확장되는 \"특이점\"의 해로 예측했습니다. 이 책의 마지막 장에서 커즈와일과 대화하는 AI 카산드라도 바로 2029년의 존재입니다.",
    short: "2029년 (특이점은 2045년)"
  },
  {
    cat: "2장 · 지능",
    q: "커즈와일에 따르면, AI가 튜링 테스트를 통과하려면 오히려 <span class=\"em\">해야 하는 일</span>이 있습니다. 무엇일까요?",
    choices: ["사람보다 빨리 대답하기","수학 문제를 더 잘 풀기","감정 표현을 전부 없애기","일부러 못하는 척하기"],
    answer: 3,
    aha: "많은 분야에서 지능이 훨씬 떨어지는 것처럼 보여야 합니다. 수학 문제를 순식간에 풀어버리면 AI라는 게 탄로나기 때문입니다. 다시 말해 — 튜링 테스트를 통과하는 AI는 이미 대다수 분야에서 최고의 인간보다 훨씬 뛰어난 존재라는 역설입니다.",
    short: "못하는 척하기 (탄로나니까)"
  },
  {
    cat: "2장 · 지능",
    q: "신경과학의 놀라운 실험 하나. 동물의 <span class=\"em\">청각 피질(듣기 담당 뇌 부위)</span>에 눈에서 오는 시각 신호를 연결하면, 어떤 일이 벌어질까요?",
    choices: ["아무 일도 일어나지 않는다","그 부위가 「보는 법」을 배운다","청력과 시력을 모두 잃는다","소리가 두 배로 크게 들린다"],
    answer: 1,
    aha: "듣기 담당 부위가 보는 법을 학습합니다 — 말하자면 귀로 보는 셈입니다. 신피질은 부위마다 다른 기계가 아니라, 어디든 같은 알고리즘을 돌리는 약 3억 개의 패턴 인식기라는 증거입니다. 커즈와일이 말하는 \"지능의 재발명\"이란 인간 흉내가 아니라, 바로 이 알고리즘을 더 빠른 기판 위에 다시 구현하는 일입니다.",
    short: "귀로 보는 법을 학습"
  },
  {
    cat: "3장 · 정체성",
    q: "우리 몸을 이루는 <span class=\"em\">원자</span>는 대부분 얼마 만에 새것으로 교체될까요?",
    choices: ["평생 그대로다","70년마다","7~10개월마다","7~10년마다"],
    answer: 3,
    aha: "7~10년이면 대부분 교체됩니다. 물질로만 따지면 10년 전의 나와 지금의 나는 거의 다른 몸입니다. 그런데도 나는 여전히 나 — 커즈와일의 결론은 이렇습니다. \"나는 특정 물질이 아니라 패턴이다.\" 널빤지를 다 갈아 끼운 테세우스의 배가 같은 배이듯이. 그리고 패턴이라면, 수정할 수 있습니다.",
    short: "7~10년 (나는 패턴이다)"
  },
  {
    cat: "4장 · 진보",
    q: "한스 로슬링의 『팩트풀니스』. 세계의 빈곤·교육 현황을 묻는 문제에서 각국 <span class=\"em\">전문가들의 정답률</span>은, 무작위로 고르는 침팬지와 비교해 어땠을까요?",
    choices: ["침팬지보다 훨씬 높았다","침팬지와 비슷했다","침팬지보다 낮았다","문제가 쉬워 모두 만점"],
    answer: 2,
    aha: "침팬지보다 낮았습니다. 무작위로 찍느니만 못했다는 뜻 — 세상이 실제보다 나쁘다고 \"체계적으로\" 믿고 있었던 겁니다. 핑커는 이유를 이렇게 짚습니다. \"나쁜 것들은 사건이고, 좋은 것들은 과정이다.\" 살인은 하룻밤에 일어나 뉴스가 되지만, 매일 약 17만 명이 극빈층을 탈출하는 기적은 뉴스에 나오지 않습니다.",
    short: "침팬지보다 낮았다"
  },
  {
    cat: "5장 · 일",
    q: "2012년, 14만 명을 고용했던 필름의 제왕 코닥이 파산했습니다. 바로 그 해, 10억 달러에 팔린 인스타그램의 <span class=\"em\">직원 수</span>는 몇 명이었을까요?",
    choices: ["130명","13명","1,300명","13,000명"],
    answer: 1,
    aha: "13명입니다. 14만 명과 13명 — 같은 해에 일어난 이 대비가 5장의 문제의식입니다. 다만 커즈와일은 \"직업이 사라진다\"보다 \"직업 안의 과제가 바뀐다\"가 정확하다고 말합니다. ATM이 창구 직원을 없앨 거라 했지만 직원 수는 오히려 늘었습니다. 그래서 이런 말이 나옵니다 — AI가 인간을 대체하는 것이 아니라, AI를 잘 쓰는 인간이 그렇지 못한 인간을 대체한다.",
    short: "13명 (코닥은 14만 명)"
  },
  {
    cat: "6장 · 생명",
    q: "장수탈출속도(LEV) — 의학이 노화를 앞지르는 그날을 기다리며, 커즈와일이 <span class=\"em\">매일 실천하는 일</span>은 무엇일까요?",
    choices: ["보충제 약 100가지 복용","하루 한 끼 단식","매일 10km 마라톤","매일 냉수욕 한 시간"],
    answer: 0,
    aha: "하루 약 100가지 보충제를 먹습니다. 그의 아버지는 58세에 심장병으로 세상을 떠났습니다. 커즈와일의 전략은 「접이식 다리」입니다 — 지금의 임시 다리(영양·예방)로 강 중간까지 버티고, 생명공학의 다리(2단계)로 갈아타고, 나노기술(3단계)에서 강을 다 건넌다는 것. 유전체 분석 비용이 5,000만 달러에서 399달러로 떨어진 속도가 그 믿음의 근거입니다.",
    short: "보충제 약 100가지"
  },
  {
    cat: "7장 · 위험",
    q: "기술을 멈춰야 한다는 목소리에 커즈와일이 던진 반문. <span class=\"em\">\"불을 발견하지 않는 것이 답이었는가, 아니면 ___를 만드는 것이 답이었는가?\"</span> 빈칸은?",
    choices: ["물의 신전","더 큰 불","소방서","부싯돌 금지법"],
    answer: 2,
    aha: "소방서입니다. 2000년 빌 조이가 「미래는 우리를 필요로 하지 않는다」라는 글로 기술 개발 중단을 요청했을 때의 응답입니다. 다만 이 비유에는 한계도 있습니다 — 소방서는 불이 난 뒤에 끄지만, 어떤 위험은 한 번 일어나면 되돌릴 수 없으니까요. 그래서 7장은 「낙관론자가 쓴 가장 어두운 장」이라 불립니다.",
    short: "소방서 (빌 조이에 대한 응답)"
  },
  {
    cat: "8장 · 추가",
    q: "미래에서 온 AI 카산드라가 커즈와일에게 건넨 말. <span class=\"em\">\"우리는 당신의 뇌를 에뮬레이션(복제)하지 않아요. 우리는 거기에 새로운 것을 ___할 뿐이에요.\"</span> 빈칸은?",
    choices: ["업로드","추가","백업","교체"],
    answer: 1,
    aha: "추가입니다. 파충류의 뇌 위에 포유류의 뇌가, 그 위에 신피질이 얹혔지만 — 어느 단계에서도 이전의 뇌는 사라지지 않았습니다. 여덟 층이 다 쌓여도 아래는 지워지지 않는다는 것, 그것이 이 책의 마지막 대답입니다. 그런데 카산드라는 신화에서 아무도 믿지 않는 예언을 하는 인물의 이름 — 커즈와일 자신도 오랫동안 일종의 카산드라였습니다.",
    short: "추가 (대체가 아니라)"
  }
];

let qi = -1;        // 현재 문제 인덱스
let stage = 0;      // 0: 문제, 1: 정답 공개, 2: 아하 공개
let picks = [];     // 문제별 내가 고른 보기 (안 골랐으면 null)
const $ = id => document.getElementById(id);

function buildDots() {
  $('dots').innerHTML = QUESTIONS.map((_, i) =>
    `<div class="dot${i < qi ? ' done' : i === qi ? ' on' : ''}"></div>`).join('');
}

function reveal() {
  const q = QUESTIONS[qi];
  const picked = picks[qi];
  $('qChoices').classList.add('revealed');
  if (picked !== null && picked !== undefined && picked !== q.answer) {
    $('qChoices').children[picked].classList.add('wrongpick');
  }
  $('nextBtn').textContent = '추가설명';
  stage = 1;
}

function pick(i) {
  if (stage !== 0) return;
  picks[qi] = i;
  reveal();
}

function renderQuestion() {
  const q = QUESTIONS[qi];
  $('qNo').textContent = qi + 1;
  $('qCat').textContent = q.cat;
  $('qText').innerHTML = q.q;
  $('qChoices').innerHTML = q.choices.map((c, i) =>
    `<div class="choice${i === q.answer ? ' correct' : ''}" onclick="pick(${i})"><span class="tag">${'①②③④'[i]}</span>${c}</div>`).join('');
  $('qChoices').classList.remove('revealed');
  $('qAha').classList.remove('show');
  $('qAhaText').textContent = q.aha;
  $('nextBtn').textContent = '정답';
  stage = 0;
  // 이미 답을 확인한 문제로 되돌아온 경우 — 채점 상태 복원
  if (picks[qi] !== undefined) {
    reveal();
    $('qAha').classList.add('show');
    $('nextBtn').textContent = qi === QUESTIONS.length - 1 ? '결과 보기' : '다음 문제';
    stage = 2;
  }
  buildDots();
}

function show(id) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  $(id).classList.add('active');
}

function start() {
  qi = 0;
  show('quiz');
  renderQuestion();
}

function advance() {
  if (stage === 0) {
    if (picks[qi] === undefined) picks[qi] = null; // 진행자 모드 — 고르지 않고 공개
    reveal();
  } else if (stage === 1) {
    $('qAha').classList.add('show');
    $('nextBtn').textContent = qi === QUESTIONS.length - 1 ? '결과 보기' : '다음 문제';
    stage = 2;
  } else {
    if (qi === QUESTIONS.length - 1) { finish(); return; }
    qi++;
    renderQuestion();
    show('quiz');
  }
}

function back() {
  if (qi > 0) { qi--; renderQuestion(); }
}

function finish() {
  const answered = picks.filter(p => p !== null && p !== undefined).length;
  const score = picks.filter((p, i) => p === QUESTIONS[i].answer).length;
  if (answered > 0) {
    $('finTitle').textContent = `열 문제 중 ${score}문제!`;
    $('finMsg').textContent =
      score >= 9 ? '특이점급입니다. 이 층은 다시 읽지 않아도 되겠는데요.' :
      score >= 7 ? '수확 가속의 법칙 — 읽은 만큼 돌아왔습니다.' :
      score >= 4 ? '절반은 넘었습니다. 틀린 자리만 다시 펼치면 됩니다.' :
                   '괜찮습니다. 오늘 만난 열 문장이 다음 읽기의 밑줄이 됩니다.';
  } else {
    $('finTitle').textContent = '열 문제, 모두 끝났습니다';
    $('finMsg').textContent = '이제 채점하고, 상품 받으러 나오세요.';
  }
  $('recapTable').innerHTML = QUESTIONS.map((q, i) => {
    const p = picks[i];
    const ox = (p === null || p === undefined) ? '<td class="ox n">−</td>'
      : p === q.answer ? '<td class="ox o">O</td>' : '<td class="ox x">X</td>';
    return `<tr><td class="no">${i + 1}</td>${ox}<td>${q.cat}</td><td class="ans">${q.short}</td></tr>`;
  }).join('');
  show('finale');
}

function restart() {
  qi = -1;
  picks = [];
  show('cover');
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowRight' || e.code === 'Enter') {
    e.preventDefault();
    if ($('cover').classList.contains('active')) start();
    else if ($('quiz').classList.contains('active')) advance();
  } else if (e.code === 'ArrowLeft' && $('quiz').classList.contains('active')) {
    back();
  }
});
</script>
