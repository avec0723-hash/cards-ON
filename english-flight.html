<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F5F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="영어 비행">
<meta property="og:type" content="website">
<meta property="og:title" content="야간비행의 영어 비행 — 매일 5분, 한 장면">
<meta property="og:description" content="학교 35일 · 병원 15일. 한국어 상황을 보고 내가 먼저 말한 뒤 정답을 확인하는 리콜 연습.">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary">
<title>야간비행의 영어 비행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F5F1; --card:#FFFFFF; --ink:#1F2430; --soft:#6B7280; --faint:#A0A6B1; --line:#E6E1D9;
    --acc:#23365C; --acc-soft:#E9EDF6; --acc-ink:#FFFFFF;
    --warn:#B4532A; --warn-soft:#FBEDE6;
    --ok:#23365C;
  }
  body[data-track="hospital"]{ --acc:#7A5C4A; --acc-soft:#F3EBE4; --ok:#7A5C4A; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:520px;margin:0 auto;padding:20px 18px 40px;min-height:100%}
  .screen{display:none}
  .screen.on{display:block;animation:rise .28s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  .top .back{font-size:14px;color:var(--soft);background:none;border:none;font-family:inherit;padding:6px 2px;cursor:pointer}
  .top .step{font-size:12px;letter-spacing:2px;color:var(--faint);font-weight:700}
  h1{font-family:'Noto Serif KR',serif;font-size:26px;font-weight:600;line-height:1.35;letter-spacing:-.3px}
  .sub{color:var(--soft);font-size:14px;margin-top:6px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;box-shadow:0 2px 10px rgba(30,30,40,.04)}
  .stack>*+*{margin-top:14px}
  .btn{display:block;width:100%;font-family:inherit;font-size:16px;font-weight:700;padding:15px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:left;transition:transform .08s}
  .btn:active{transform:scale(.99)}
  .btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);text-align:center}
  .btn.ghost{background:transparent;color:var(--soft);font-weight:500;text-align:center;border-style:dashed}
  .btn .big{font-size:20px;display:block}
  .btn .meta{display:block;font-size:13px;font-weight:400;color:var(--soft);margin-top:2px}
  .btn.primary .meta{color:rgba(255,255,255,.75)}
  .row{display:flex;gap:10px}
  .row .btn{flex:1;text-align:center}
  /* 홈 */
  .track{border-left:5px solid var(--acc);padding-left:16px}
  .track.h{border-left-color:#7A5C4A}
  .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
  .track.h .bar i{background:#7A5C4A}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
  .days button{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);background:var(--card);font-family:inherit;font-size:13px;color:var(--soft);cursor:pointer}
  .days button.done{background:var(--acc-soft);color:var(--acc);border-color:transparent;font-weight:700}
  .track.h .days button.done{background:#F3EBE4;color:#7A5C4A}
  .days button.next{border:2px solid var(--acc);color:var(--acc);font-weight:700}
  .track.h .days button.next{border-color:#7A5C4A;color:#7A5C4A}
  .tiny{font-size:12px;color:var(--faint);margin-top:8px}
  /* 장면 */
  .line{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
  .line:last-child{border-bottom:none}
  .who{flex:0 0 44px;font-size:12px;font-weight:700;color:var(--faint);padding-top:4px;letter-spacing:.5px}
  .line.me .who{color:var(--acc)}
  .en{font-size:17px;font-weight:500;line-height:1.5}
  .line.me .en{color:var(--acc)}
  .ko{font-size:13px;color:var(--soft);margin-top:2px}
  .spk{background:none;border:none;font-size:18px;cursor:pointer;padding:0 6px;color:var(--soft);vertical-align:middle}
  /* 리콜 */
  .qlabel{font-size:12px;letter-spacing:2px;color:var(--faint);font-weight:700;margin-bottom:12px}
  .hint{font-size:22px;font-weight:700;line-height:1.5;word-break:keep-all;min-height:66px}
  .answer{display:none;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
  .answer.on{display:block}
  .answer .en{font-size:21px;font-weight:700;color:var(--acc);line-height:1.5}
  .answer .memo{font-size:14px;color:var(--soft);margin-top:10px;padding:10px 12px;background:var(--acc-soft);border-radius:10px}
  .answer .memo:empty{display:none}
  .prog{display:flex;gap:4px;margin-bottom:14px}
  .prog i{flex:1;height:4px;border-radius:99px;background:var(--line)}
  .prog i.d{background:var(--acc)}
  .prog i.a{background:var(--warn)}
  .again .btn{border-color:var(--warn);color:var(--warn)}
  /* 마무리 */
  .keybox{text-align:center;padding:36px 20px}
  .keybox .lb{font-size:12px;letter-spacing:3px;color:var(--faint);font-weight:700}
  .keybox .en{font-family:'Noto Serif KR',serif;font-size:24px;font-weight:600;color:var(--acc);margin:16px 0 8px;line-height:1.45}
  .keybox .ko{font-size:15px}
  .foot{margin-top:28px;text-align:center;font-size:12px;color:var(--faint)}
  .foot a{color:var(--faint)}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:14px;padding:10px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.on{opacity:.95}
</style>
</head>
<body data-track="school">
<div class="wrap">

<!-- 홈 -->
<section id="home" class="screen on">
  <div class="top"><span class="step">FLIGHT LOG</span><span class="step" id="today"></span></div>
  <h1>야간비행의 영어 비행</h1>
  <p class="sub">매일 5분 — 한 장면, 리콜 몇 문장, 소리 내어 한 번.</p>
  <div class="stack" style="margin-top:22px">
    <div class="card track" id="trk-school">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <div><b style="font-size:18px">🏫 학교</b> <span class="sub" style="display:inline" id="s-title"></span></div>
        <span class="tiny" id="s-count"></span>
      </div>
      <div class="bar"><i id="s-bar"></i></div>
      <button class="btn primary" style="margin-top:14px" id="s-go"></button>
      <div class="days" id="s-days"></div>
      <div class="tiny">숫자를 누르면 그날을 다시 열 수 있어요.</div>
    </div>
    <div class="card track h" id="trk-hospital">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <div><b style="font-size:18px">🏥 병원</b> <span class="sub" style="display:inline" id="h-title"></span></div>
        <span class="tiny" id="h-count"></span>
      </div>
      <div class="bar"><i id="h-bar"></i></div>
      <button class="btn primary" style="margin-top:14px;background:#7A5C4A;border-color:#7A5C4A" id="h-go"></button>
      <div class="days" id="h-days"></div>
    </div>
    <button class="btn ghost" id="weekly-btn" style="display:none"></button>
    <div class="tiny" id="due-info" style="text-align:center"></div>
  </div>
  <div class="foot">진도는 이 폰의 브라우저에 저장됩니다 · <a href="#" id="reset">처음부터</a></div>
</section>

<!-- 세션 -->
<section id="session" class="screen">
  <div class="top"><button class="back" id="s-back">← 홈</button><span class="step" id="s-step"></span></div>
  <div id="s-body"></div>
</section>

</div>
<div class="toast" id="toast"></div>

<script>
const DATA = {"school": [{"day": 1, "title": "첫 인사 · 역할 소개", "intro": "9월 1일 아침, 원어민 선생님이 행정실에 들른다.", "scene": [{"who": "NET", "en": "Hi — I heard there's someone new in the admin office.", "ko": "안녕하세요, 행정실에 새로 오신 분이 있다고 들었어요."}, {"who": "나", "en": "Yes, that's me. I'm in charge of the administrative office starting this September.", "ko": "네, 접니다. 이번 9월부터 행정실을 맡게 됐어요."}, {"who": "NET", "en": "Nice to meet you. I'm one of the native English teachers.", "ko": "반갑습니다. 원어민 교사 중 한 명이에요."}, {"who": "나", "en": "Nice to meet you too. Just come see me about anything — your contract, housing, pay, anything at all.", "ko": "저도 반갑습니다. 뭐든 저한테 오세요 — 계약, 사택, 급여, 뭐든지요."}, {"who": "NET", "en": "That's good to know. Thanks!", "ko": "알아 두면 좋겠네요. 고마워요!"}, {"who": "나", "en": "Are you settling in okay this semester?", "ko": "이번 학기 잘 적응하고 계세요?"}], "cards": [{"n": 1, "ko": "나 소개 — 9월부터 행정실 맡았다", "en": "I'm in charge of the administrative office starting this September.", "memo": "in charge of — 이미 몸에 붙은 표현"}, {"n": 2, "ko": "뭐든 저한테 오세요 — 계약·사택·급여·뭐든지", "en": "Just come see me about anything — your contract, housing, pay, anything at all.", "memo": "⚠️ whatever 금지 · visit 금지"}, {"n": 3, "ko": "조금 천천히 말해 주세요, 영어가 아직 돌아오는 중이라", "en": "Could you speak a little slower? My English is still coming back.", "memo": "**a** little — a 빠지면 뜻이 뒤집힘. 자기 낮추기는 한 번만"}, {"n": 4, "ko": "잘 적응하고 계세요?", "en": "Are you settling in okay?", "memo": "settle in = 새 자리에 적응"}, {"n": 5, "ko": "왜 옮겼냐 물으면 — 미뤄둔 걸 정리할 좋은 구실", "en": "Honestly, it's a good excuse to finally clear out things I'd been putting off.", "memo": "an excuse to ~ 따뜻한 용법"}, {"n": 6, "ko": "이름 한 번만 다시 말해 주시겠어요?", "en": "Sorry, could you tell me your name again?", "memo": "원어민 3명 — 이름은 첫날 외운다"}, {"n": 7, "ko": "앞으로 잘 부탁드립니다", "en": "I'm looking forward to working with you.", "memo": "\"잘 부탁드립니다\"의 가장 가까운 착지"}], "key": "Just come see me about anything — anything at all."}, {"day": 2, "title": "되묻기 3단계", "intro": "복도에서 갑자기, 빠르게.", "scene": [{"who": "NET", "en": "Hey, quick question — so my contract's up in December and I was wondering about the renewal paperwork, like when that needs to happen?", "ko": "잠깐 질문요 — 제 계약이 12월에 끝나는데 갱신 서류는 언제쯤 해야 하나요?"}, {"who": "나", "en": "Sorry, could you say that again — a little slower?", "ko": "죄송한데 한 번만 더, 조금 천천히요?"}, {"who": "NET", "en": "Sure. My contract ends in December. When do I need to do the renewal paperwork?", "ko": "네. 계약이 12월에 끝나요. 갱신 서류는 언제 해야 하죠?"}, {"who": "나", "en": "So you're saying the contract ends in December, is that right?", "ko": "그러니까 계약이 12월에 끝난다는 말씀이시죠?"}, {"who": "NET", "en": "Right.", "ko": "맞아요."}, {"who": "나", "en": "Got it. Let me check on that and get back to you by Friday.", "ko": "알겠어요. 확인해서 금요일까지 알려드릴게요."}], "cards": [{"n": 1, "ko": "한 번만 더, 조금 천천히요", "en": "Sorry, could you say that again — a little slower?", "memo": "speak again ✗ → **say** that again"}, {"n": 2, "ko": "그러니까 계약이 12월에 끝난다는 거죠?", "en": "So you're saying the contract ends in December, is that right?", "memo": "Then ✗ **So** · ⚠️ end up ≠ 끝나다"}, {"n": 3, "ko": "조금만 천천히 말해 주실래요? (다 놓쳤을 때)", "en": "Sorry, could you slow down a little?", "memo": "되묻기 1단계"}, {"n": 4, "ko": "알겠어요 (짧은 수신 확인)", "en": "Got it.", "memo": "침묵보다 낫다 — 알아들었다는 신호"}, {"n": 5, "ko": "확인해서 금요일까지 알려드릴게요", "en": "Let me check on that and get back to you by Friday.", "memo": "**by** + 시점이 신뢰를 만든다"}, {"n": 6, "ko": "정리하자면 — 계약 자체가 아니라 갱신 서류 말씀이죠?", "en": "Just to be clear — the renewal paperwork, not the contract itself?", "memo": "just to be clear = 정리 확인"}, {"n": 7, "ko": "죄송해요, 마지막 부분을 놓쳤어요", "en": "Sorry, I missed the last part.", "memo": "부분만 놓쳤을 때"}], "key": "So you're saying ~, is that right?"}, {"day": 3, "title": "확인 후 회신 · 확답 보류 · 글로 요청", "intro": "퇴직금 액수를 묻는다. 즉답할 수 없다.", "scene": [{"who": "NET", "en": "Do you know how much I'd get for severance if I leave next year?", "ko": "내년에 그만두면 퇴직금이 얼마나 나오는지 아세요?"}, {"who": "나", "en": "I can't give you a definite answer right now, but I'll check with the person in charge today.", "ko": "지금 확답은 못 드리지만 오늘 담당자에게 확인해 볼게요."}, {"who": "NET", "en": "Okay. Roughly, though?", "ko": "네. 대략이라도요?"}, {"who": "나", "en": "I'd rather not guess — I want to make sure I get the numbers right. Could you email me the question?", "ko": "짐작으로 말씀드리진 않을게요 — 숫자는 정확해야 하니까요. 질문을 이메일로 보내 주시겠어요?"}, {"who": "NET", "en": "Sure, I'll send it this afternoon.", "ko": "네, 오후에 보낼게요."}, {"who": "나", "en": "Thanks. I'll get back to you by tomorrow.", "ko": "고마워요. 내일까지 답드릴게요."}], "cards": [{"n": 1, "ko": "지금 확답은 못 드리지만 오늘 담당자에게 확인할게요", "en": "I can't give you a definite answer right now, but I'll check with the person in charge today.", "memo": "the person in charge = 담당자"}, {"n": 2, "ko": "이메일로 보내 주시겠어요? 정확히 하고 싶어서요", "en": "Could you email me that? I want to make sure I get the details right.", "memo": "★ 총괄의 최강 도구 — 못 알아들어서가 아니라 정확하려고"}, {"n": 3, "ko": "짐작으로 말하진 않을게요", "en": "I'd rather not guess.", "memo": "급여·계약에서 즉답 안 하는 게 정답"}, {"n": 4, "ko": "내일까지 답드릴게요", "en": "I'll get back to you by tomorrow.", "memo": "get back to = 회신하다"}, {"n": 5, "ko": "금요일까지 보내 주실 수 있을까요? (조심스럽게)", "en": "Would it be okay if you sent me that by Friday?", "memo": "if + 과거형 = 한 발 물러선 부탁"}, {"n": 6, "ko": "적어 둘게요", "en": "Let me write that down.", "memo": "숫자·날짜 앞에서"}, {"n": 7, "ko": "확인해 봤는데요, 이렇습니다 (회신 첫 문장)", "en": "I checked, and here's what I found out.", "memo": "find out = 알아내다"}, {"n": 8, "ko": "기다리게 해서 죄송해요 — 생각보다 오래 걸렸어요", "en": "Sorry for the wait — it took longer than I expected.", "memo": "늦은 회신의 첫 줄"}], "key": "I want to make sure I get the details right."}, {"day": 4, "title": "복도 스몰토크 (아침·날씨·주말)", "intro": "출근길 복도.", "scene": [{"who": "NET", "en": "Morning! How's it going?", "ko": "좋은 아침이에요! 잘 지내요?"}, {"who": "나", "en": "Pretty good — busy morning, though. How about you?", "ko": "그럭저럭요 — 아침이 좀 바쁘긴 하네요. 선생님은요?"}, {"who": "NET", "en": "Same. It's so humid today.", "ko": "저도요. 오늘 진짜 습하네요."}, {"who": "나", "en": "I know. It's supposed to rain this afternoon.", "ko": "그러게요. 오후에 const KEY='ef_v1';
const $=(s)=>document.querySelector(s);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const STAGES=[1,3,7]; // 됐다 → 1일 → 3일 → 7일 → 졸업

function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.tracks)return s;}catch(e){}return {tracks:{school:{done:[]},hospital:{done:[]}},cards:{},weekly:{school:[],hospital:[]}};}

// ── 소리

if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(t){if(!('speechSynthesis' in window))return toast('이 브라우저는 소리를 지원하지 않아요');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[~—]/g,',').replace(/\s*\/\s*/g,'. '));u.lang='en-US';u.rate=0.92;if(voice)u.voice=voice;speechSynthesis.speak(u);}

// ── 카드 스케줄
function cid(track,day,n){return track+'-'+day+'-'+n;}
function markOk(id){const c=S.cards[id]||{stage:0};const st=Math.min(c.stage||0,STAGES.length);if(st>=STAGES.length){c.grad=true;c.due=null;}else{c.due=addDays(todayStr(),STAGES[st]);c.stage=st+1;}c.again=false;S.cards[id]=c;}
function markAgain(id){const c=S.cards[id]||{};c.stage=0;c.again=true;c.due=addDays(todayStr(),1);c.grad=false;S.cards[id]=c;}
function dueCards(track){const t=todayStr();const out=[];for(const id in S.cards){const c=S.cards[id];if(!id.startsWith(track+'-')||c.grad||!c.due||c.due>t)continue;const [tr,day,n]=id.split('-');const d=DATA[track].find(x=>x.day==+day);const card=d&&d.cards.find(x=>x.n==+n);if(card)out.push({id,card,day:+day,again:!!c.again});}
  out.sort((a,b)=>(b.again-a.again)||(a.day-b.day));return out.slice(0,5);}

// ── 홈
function nextDay(track){const done=S.tracks[track].done;const d=DATA[track].find(x=>!done.includes(x.day));return d?d.day:null;}
function renderHome(){
  document.body.dataset.track='school';
  $('#today').textContent=todayStr().replace(/-/g,'.');
  for(const [tr,p] of [['school','s'],['hospital','h']]){
    const days=DATA[tr],done=S.tracks[tr].done,nd=nextDay(tr);
    $('#'+p+'-count').textContent=done.length+' / '+days.length;
    $('#'+p+'-bar').style.width=(100*done.length/days.length)+'%';
    const btn=$('#'+p+'-go');
    if(nd){const d=days.find(x=>x.day===nd);$('#'+p+'-title').textContent='';btn.innerHTML=`<span class="big">Day ${nd} · ${d.title}</span><span class="meta">${d.cards.length}문장 · 약 5분</span>`;btn.onclick=()=>startSession(tr,nd);}
    else{btn.innerHTML=`<span class="big">${tr==='school'?'35일 완주 🎉':'15일 완주 🎉'}</span><span class="meta">아래 숫자로 아무 날이나 다시 열 수 있어요</span>`;btn.onclick=null;}
    const grid=$('#'+p+'-days');grid.innerHTML='';
    days.forEach(d=>{const b=document.createElement('button');b.textContent=d.day;if(done.includes(d.day))b.classList.add('done');if(d.day===nd)b.classList.add('next');b.onclick=()=>startSession(tr,d.day);grid.appendChild(b);});
  }
  // 주간 비행
  const wb=$('#weekly-btn');wb.style.display='none';
  for(const tr of ['school','hospital']){const n=S.tracks[tr].done.length;const wk=Math.floor(n/7);if(wk>0&&!S.weekly[tr].includes(wk)){wb.style.display='block';wb.textContent=`🔁 주간 비행 — ${tr==='school'?'학교':'병원'} ${wk}주차 문장 한 바퀴 (선택)`;wb.onclick=()=>startWeekly(tr,wk);break;}}
  const dueN=dueCards('school').length+dueCards('hospital').length;

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$('#'+id).classList.add('on');window.scrollTo(0,0);}
$('#s-back').onclick=()=>{if(confirm('홈으로 갈까요? (이번 세션 진행은 저장되지 않아요)'))renderHome();};
$('#reset').onclick=(e)=>{e.preventDefault();if(confirm('모든 진도와 복습 기록을 지우고 처음부터 시작할까요?')){localStorage.removeItem(KEY);S=load();renderHome();}};

// ── 세션
let Q=null;
function startSession(track,day){
  const d=DATA[track].find(x=>x.day===day);
  document.body.dataset.track=track;
  const takeoff=dueCards(track).filter(x=>x.day!==day);
  Q={track,day,d,mode:'session',takeoff,ti:0,ci:0,again:[],phase:takeoff.length?'takeoff':'scene',redo:false};
  show('session');render();
}
function startWeekly(track,wk){
  const days=DATA[track].filter(x=>x.day>(wk-1)*7&&x.day<=wk*7);
  const cards=[];days.forEach(d=>{const key=d.cards.find(c=>c.en===d.key);const pick=[];if(key)pick.push(key);for(const c of d.cards){if(pick.length>=3)break;if(c!==key)pick.push(c);}pick.forEach(c=>cards.push({id:cid(track,d.day,c.n),card:c,day:d.day}));});
  document.body.dataset.track=track;

}
function render(){

    const it=Q.takeoff[Q.ti];

    b.innerHTML=cardHTML(it.card,`이륙 점검 · Day ${it.day}에서`,it.again,Q.takeoff.length,Q.ti);
    bindCard((ok)=>{ok?markOk(it.id):markAgain(it.id);save();Q.ti++;if(Q.ti>=Q.takeoff.length){Q.phase='scene';}render();});
    return;
  }
  if(Q.phase==='scene'){
    const d=Q.d;$('#s-step').textContent=`Day ${d.day} · 오늘 장면`;
    b.innerHTML=`<h1>${d.title}</h1><p class="sub">${d.intro||''}</p>
      <div class="card" style="margin-top:16px">${d.scene.map(l=>`<div class="line ${l.who==='나'?'me':''}"><div class="who">${l.who}</div><div><div class="en">${esc(l.en)} ${spk(l.en)}</div><div class="ko">${esc(l.ko)}</div></div></div>`).join('')}</div>
      <p class="tiny" style="margin:14px 0 10px;text-align:center">한 번 읽고 — 파란 줄은 소리 내어. 그다음 리콜.</p>
      <button class="btn primary" id="go-recall">리콜 시작 → ${d.cards.length}문장</button>`;
    $('#go-recall').onclick=()=>{Q.phase='recall';Q.ci=0;Q.list=d.cards.map(c=>({id:cid(Q.track,d.day,c.n),card:c,day:d.day}));render();};
    return;
  }
  if(Q.phase==='recall'||Q.phase==='weekly'){
    const list=Q.list;
    if(Q.ci>=list.length){
      if(Q.again.length&&!Q.redo){Q.list=Q.again.slice();Q.again=[];Q.ci=0;Q.redo=true;toast('"다시" 표시한 문장만 한 번 더');render();return;}
      Q.phase='final';render();return;
    }
    const it=list[Q.ci];
    const lb=Q.mode==='weekly'?`주간 비행 · Day ${it.day}`:(Q.redo?'한 번 더':`리콜 ${it.card.n}`);
    $('#s-step').textContent=Q.mode==='weekly'?`주간 비행 ${Q.ci+1}/${list.length}`:(Q.redo?`다시 ${Q.ci+1}/${list.length}`:`Day ${Q.day} · 리콜 ${Q.ci+1}/${list.length}`);
    b.innerHTML=cardHTML(it.card,lb,false,list.length,Q.ci);
    bindCard((ok)=>{

      $('#s-step').textContent='주간 비행 완료';
      b.innerHTML=`<div class="card keybox"><div class="lb">WEEK ${Q.wk}</div><div class="en">한 바퀴 돌았습니다.</div><div class="ko">틀린 문장은 내일 이륙 점검에 다시 옵니다.</div></div><button class="btn primary" style="margin-top:16px" onclick="renderHome()">홈으로</button>`;
      return;
    }
    const d=Q.d;
    if(!S.tracks[Q.track].done.includes(d.day)){S.tracks[Q.track].done.push(d.day);S.tracks[Q.track].done.sort((a,b)=>a-b);save();}

    b.innerHTML=`<div class="card keybox"><div class="lb">오늘의 한 문장</div><div class="en">${esc(d.key)}</div><div class="ko">${kc?esc(kc.ko):''}</div>${canSpeak?`<button class="btn ghost" style="margin-top:18px" onclick="speak(${JSON.stringify(d.key).replace(/"/g,'&quot;')})">🔊 듣고 한 번 더 말하기</button>`:''}</div>
      <p class="tiny" style="text-align:center;margin:14px 0">Day ${d.day} 완료. 오늘 "다시"로 남긴 문장은 내일 이륙 점검에 옵니다.</p>
      <button class="btn primary" onclick="renderHome()">홈으로</button>`;
    return;
  }
}
function cardHTML(c,label,isAgain,total,idx){
  const prog=Array.from({length:total},(_,i)=>`<i class="${i<idx?'d':''}"></i>`).join('');
  return `<div class="prog">${prog}</div>
  <div class="card ${isAgain?'again':''}">
    <div class="qlabel">${esc(label)}${isAgain?' · 지난번 다시':''}</div>
    <div class="hint">${esc(c.ko)}</div>
    <div class="answer" id="ans"><div class="en">${esc(c.en)} ${spk(c.en)}</div><div class="memo">${esc(c.memo)}</div></div>
  </div>
  <div id="act" style="margin-top:14px">
    <button class="btn primary" id="reveal">먼저 말해 보고 → 정답 보기</button>
  </div>`;
}
function bindCard(done){
  $('#reveal').onclick=()=>{
    $('#ans').classList.add('on');
    const en=$('#ans .en').textContent.replace('🔊','').trim();
    if(canSpeak)speak(en);
    $('#act').innerHTML=`<div class="row"><button class="btn" id="b-again" style="border-color:var(--warn);color:var(--warn)">다시</button><button class="btn primary" id="b-ok">됐다</button></div>`;
    $('#b-ok').onclick=()=>done(true);$('#b-again').onclick=()=>done(false);
  };
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
renderHome();
</script>
</body>
</html>
