<style>
  :root {
    --paper: #F2EDE4;
    --card: #FBF8F2;
    --ink: #1B2A2E;
    --ink-soft: #4C5D62;
    --ink-faint: #8D999B;
    --deep: #12262E;
    --deep-card: #1B3540;
    --teal: #7FD4D8;

    --teal-soft: #B9E5E7;

  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);

    align-items: center;
    justify-content: center;

  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 12% 18%, rgba(127,212,216,0.10) 0, transparent 30%),
      radial-gradient(circle at 88% 82%, rgba(232,120,90,0.08) 0, transparent 35%);

  }
  .stage {
    width: 100%;
    max-width: 880px;
    position: relative;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--rule);
    border-top: 4px solid var(--coral);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 56px 60px 48px;
    display: none;
    animation: rise .45s ease both;
  }
  .card.active { display: block; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── 표지 ── */
  .cover { text-align: center; padding: 72px 60px; background: var(--deep); color: var(--paper); border-top-color: var(--teal); }
  .cover .school {
    display: inline-block;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 5px;
    color: var(--deep);
    background: var(--teal);
    padding: 6px 14px 5px 19px;
    margin-bottom: 26px;
  }
  .cover .layer {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-size: 15px;
    letter-spacing: 4px;
    color: var(--coral);
    margin-bottom: 10px;
  }
  .cover .layer .nn { font-size: 34px; letter-spacing: 0; }
  .cover h1 {
    font-size: 44px;
    font-weight: 900;
    color: var(--paper);
    letter-spacing: -0.5px;
    line-height: 1.3;
    margin-bottom: 14px;
  }
  .cover h1 .em { color: var(--teal); }
  .cover .sub {
    font-size: 17px;
    color: rgba(242,237,228,0.8);

  }
  .ornament {
    display: flex; align-items: center; justify-content: center;
    gap: 14px; margin: 28px 0 36px;
    color: var(--coral);
    font-size: 14px;
  }
  .ornament::before, .ornament::after {
    content: '';
    width: 90px; height: 1px;
    background: linear-gradient(to right, transparent, rgba(232,120,90,0.7));
  }
  .ornament::after { background: linear-gradient(to left, transparent, rgba(232,120,90,0.7)); }
  .rules {
    display: inline-block;
    text-align: left;
    background: var(--deep-card);
    border: 1px solid rgba(127,212,216,0.25);
    border-radius: 12px;
    padding: 22px 32px;
    font-size: 15.5px;
    color: rgba(242,237,228,0.88);
    margin-bottom: 42px;
  }
  .rules li { list-style: none; padding: 3px 0; }
  .rules li::before { content: '· '; color: var(--teal); font-weight: 700; }

  /* ── 문제 ── */
  .qhead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 26px;
  }
  .qnum {
    font-size: 15px;
    letter-spacing: 3px;
    color: var(--teal-ink);
    font-weight: 700;
  }
  .qnum b { font-size: 26px; color: var(--coral-deep); letter-spacing: 0; }
  .qcat {
    font-size: 13.5px;
    font-weight: 700;
    color: #fff;
    background: var(--teal-ink);
    padding: 5px 16px;
    border-radius: 999px;
    letter-spacing: 1px;
  }
  .qtext {
    font-size: 27px;
    font-weight: 900;
    color: var(--ink);
    line-height: 1.55;
    margin-bottom: 34px;
    word-break: keep-all;
  }
  .qtext .em { color: var(--coral-deep); }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 30px; }
  .choice {
    border: 1.5px solid var(--rule);
    border-radius: 12px;
    padding: 17px 22px;
    font-size: 19px;
    background: #fff;
    transition: all .35s ease;
    display: flex;
    align-items: center;
    gap: 14px;
    word-break: keep-all;
    cursor: pointer;
  }
  .choices:not(.revealed) .choice:hover {
    border-color: var(--teal-ink);
    transform: translateY(-1px);
  }
  .revealed .choice { cursor: default; }
  .choice .tag {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1.5px solid var(--teal-ink);
    color: var(--teal-ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    font-weight: 700;
  }
  .revealed .choice { opacity: 0.35; cursor: default; }
  .revealed .choice.correct {
    opacity: 1;
    background: var(--teal-ink);
    border-color: var(--teal-ink);
    color: #fff;
    transform: scale(1.03);
    box-shadow: 0 8px 24px rgba(44,117,127,0.35);
  }
  .revealed .choice.correct .tag {
    background: var(--teal);
    border-color: var(--teal);
    color: var(--deep);
  }
  .revealed .choice.wrongpick {
    opacity: 1;
    background: var(--coral);
    border-color: var(--coral);
    color: #fff;
  }
  .revealed .choice.wrongpick .tag {
    background: #fff;
    border-color: #fff;
    color: var(--coral-deep);
  }
  .revealed .choice.wrongpick .tag::after { content: ''; }
  .aha {
    display: none;
    font-family: var(--serif);
    background: rgba(127,212,216,0.22);
    border-left: 4px solid var(--coral);
    border-radius: 0 12px 12px 0;
    padding: 22px 28px;
    font-size: 17px;
    color: var(--ink);
    line-height: 1.8;
    margin-bottom: 30px;
    animation: rise .4s ease both;
    word-break: keep-all;
  }
  .aha.show { display: block; }
  .aha .label {
    font-family: var(--sans);
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--teal-ink);
    font-weight: 900;
    display: block;
    margin-bottom: 8px;
  }

  /* ── 버튼·진행 ── */
  .controls { display: flex; justify-content: space-between; align-items: center; }
  .btn {
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    padding: 13px 36px;
    border-radius: 999px;
    border: 1.5px solid var(--deep);
    background: var(--deep);
    color: var(--paper);
    cursor: pointer;
    letter-spacing: 1px;
    transition: all .25s ease;
  }
  .btn:hover { background: var(--deep-card); transform: translateY(-1px); }
  .btn.ghost { background: transparent; color: var(--deep); }
  .btn.ghost:hover { background: rgba(18,38,46,0.06); }
  .btn.coral { background: var(--coral); border-color: var(--coral); color: #fff; }
  .btn.coral:hover { background: var(--coral-deep); }
  .dots { display: flex; gap: 8px; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: rgba(18,38,46,0.15);
    transition: all .3s ease;
  }
  .dot.on { background: var(--coral); transform: scale(1.25); }
  .dot.done { background: var(--teal-ink); }
  .hint {
    text-align: center;
    font-size: 13px;
    color: var(--ink-faint);
    margin-top: 18px;
    letter-spacing: 1px;
  }
  .cover .hint { color: rgba(242,237,228,0.5); }

  /* ── 마무리 ── */
  .finale { text-align: center; padding: 64px 60px; }
  .finale .school {
    display: inline-block;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #fff;
    background: var(--teal-ink);
    padding: 5px 12px 4px 17px;
    margin-bottom: 20px;
  }
  .finale h2 {
    font-size: 38px;
    font-weight: 900;
    color: var(--deep);
    margin-bottom: 12px;
    letter-spacing: -0.5px;
  }
  .finale .msg { font-size: 18px; color: var(--ink-soft); margin-bottom: 40px; }
  .recap {
    text-align: left;
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 28px 36px;
    margin-bottom: 36px;
  }
  .recap h3 {
    font-size: 15px; letter-spacing: 3px; font-weight: 900;
    color: var(--teal-ink); margin-bottom: 16px;
    text-align: center;
  }
  .recap table { width: 100%; border-collapse: collapse; font-size: 16px; }
  .recap td { padding: 7px 8px; border-bottom: 1px dashed var(--rule); vertical-align: top; }
  .recap tr:last-child td { border-bottom: none; }
  .recap .no { color: var(--coral-deep); font-weight: 900; width: 34px; }
  .recap .ans { color: var(--deep); font-weight: 700; white-space: nowrap; padding-left: 14px; }
  .recap .ox { width: 30px; font-weight: 900; text-align: center; }
  .recap .ox.o { color: var(--teal-ink); }
  .recap .ox.x { color: var(--coral-deep); }
  .recap .ox.n { color: var(--ink-faint); font-weight: 400; }

  @media (max-width: 640px) {
    .card { padding: 36px 26px; }
    .cover h1 { font-size: 30px; }
    .qtext { font-size: 21px; }
    .choices { grid-template-columns: 1fr; }
    .choice { font-size: 17px; }
    .recap .ans { white-space: normal; }
  }
</style>

<script>
const QUESTIONS = [
  {
    cat: "세 단계",
    q: "특이점까지 살아남기 위한 커즈와일의 1단계 전략. 그가 <span class=\"em\">매일 실천</span>하는 것은?",
    choices: ["매일 10km 달리기","하루 한 끼 단식","보충제 약 100가지 복용","매일 냉수욕 한 시간"],
    answer: 2,
    aha: "하루 약 100가지 보충제입니다. 그의 아버지는 58세에 심장병으로 세상을 떠났고, 커즈와일은 자신에게 같은 유전적 위험이 있다고 봅니다. 전략은 세 단계예요. 1단계는 지금의 영양·예방 의학, 2단계는 10~20년 뒤의 생명공학, 3단계는 20~30년 뒤의 나노기술. 임시 다리로 강 중간까지 건너고 더 나은 다리로 갈아타는 식이죠.",
    short: "보충제 약 100가지"
  },
  {
    cat: "생물학 = 정보",
    q: "인간 게놈 프로젝트는 13년과 27억 달러가 들었습니다(1990~2003). <span class=\"em\">오늘날</span> 같은 작업에 드는 시간과 비용은?",
    choices: ["하루 · 200달러 이하","한 달 · 2만 달러","1년 · 100만 달러","3년 · 1,000만 달러"],
    answer: 0,
    aha: "하루, 200달러 아래입니다. 무어의 법칙보다 가파른 하락이에요. 커즈와일이 \"생물학은 정보 기술이 됐다\"고 말하는 근거가 이것입니다. DNA는 소프트웨어, 단백질은 그 실행 결과, 세포는 프로세서 — 그렇게 보면 노화는 소프트웨어 버그의 축적이고, 버그라면 찾아서 고칠 수 있습니다.",
    short: "하루 · 200달러 이하"
  },
  {
    cat: "좀비 세포",
    q: "분열을 멈추고 염증 물질을 뿜어내며 노화를 앞당기는 세포. 흔히 <span class=\"em\">「좀비 세포」</span>라 불리는 이것을 제거하는 기술의 이름은?",
    choices: ["아포토시스","텔로머라제","오토파지","세노리틱스"],
    answer: 3,
    aha: "세노리틱스입니다. 동물 실험에서 이 좀비 세포를 제거하자 수명이 25~36% 늘고 신체·인지 기능도 좋아졌어요. 6개월령 생쥐 — 사람으로 치면 중년 — 를 대상으로 한 실험이었습니다. 지금은 사람을 대상으로 한 임상 시험이 진행 중이고, 「젊음의 샘」에 가장 가까이 온 기술 중 하나로 꼽힙니다.",
    short: "세노리틱스 (수명 25~36% 연장)"
  },
  {
    cat: "야마나카 인자",
    q: "다 자란 피부 세포를 줄기세포 상태로 되돌리는 야마나카 인자. <span class=\"em\">몇 개의 유전자</span>로 이 일이 일어날까요?",
    choices: ["1개","4개","40개","400개"],
    answer: 1,
    aha: "단 4개입니다. 2006년 야마나카 신야가 발견해 2012년 노벨상을 받았어요. 이 기술 덕에 배아를 쓰지 않고도, 환자 자신의 세포로 맞춤형 줄기세포를 만들 수 있게 됐습니다. 면역 거부도 없고요. 파킨슨병 치료에서는 환자의 피부세포를 줄기세포로 되돌린 뒤 도파민 신경세포로 분화시켜 뇌에 이식하는 연구가 진행 중입니다.",
    short: "4개 (2006년 발견)"
  },
  {
    cat: "유전자 치료",
    q: "2023년 FDA 승인을 받은 CRISPR 기반 치료제 「카스게비」. 어떤 병을 고치는 약일까요?",
    choices: ["알츠하이머","류마티스 관절염","2형 당뇨","겸상 적혈구 빈혈증"],
    answer: 3,
    aha: "겸상 적혈구 빈혈증입니다. 유전자를 잘라 고쳐 병 자체를 뿌리 뽑은 첫 사례죠. 비슷한 성과가 이어지고 있어요 — 척수성 근위축증은 졸겐스마 한 번 투여로, 혈우병은 유전자 치료로 평생 맞던 주사에서 벗어났고, 유전성 실명인 레베르 선천성 흑암시는 럭스터나로 시력을 일부 되찾았습니다.",
    short: "겸상 적혈구 빈혈증 (카스게비)"
  },
  {
    cat: "나노의학",
    q: "\"나노의학은 이미 수십억 명에게 쓰였다.\" 커즈와일이 그 첫 대규모 적용 사례로 드는 것은?",
    choices: ["MRI 조영제","인공 관절의 티타늄 코팅","코로나19 mRNA 백신의 지질 나노입자","치과용 임플란트"],
    answer: 2,
    aha: "mRNA 백신의 지질 나노입자입니다. mRNA를 세포 안까지 실어 나른 그 미세한 운반체가 나노의학의 첫 대규모 인류 적용이었어요. 이건 GNR 혁명이 한꺼번에 작동한 사례이기도 합니다 — 유전공학(G)이 서열을 설계하고, 나노기술(N)이 전달하고, AI(R)가 서열을 최적화했으니까요.",
    short: "지질 나노입자 (mRNA 백신)"
  },
  {
    cat: "수명 탈출 속도",
    q: "20세기 동안 기대 수명은 매년 약 3개월씩 늘었습니다. 장수 탈출 속도(LEV)에 도달하려면 <span class=\"em\">매년 얼마나</span> 늘어야 할까요?",
    choices: ["6개월 이상","1년 이상","3년 이상","10년 이상"],
    answer: 1,
    aha: "매년 1년 이상입니다. 그러면 죽음이 계속 뒤로 물러나죠. 100미터 달리기 비유가 나옵니다 — 초당 10미터로 달리는데 결승선이 15미터씩 멀어지면 영영 닿지 못합니다. LEV는 그 반대 상황이에요. 결승선(죽음)이 내가 달리는 속도보다 느리게 물러나는 것. 커즈와일은 2030년대 초에 가능하다고 봅니다.",
    short: "연 1년 이상 (현재는 3개월)"
  },
  {
    cat: "파라비오시스",
    q: "젊은 생쥐와 늙은 생쥐의 <span class=\"em\">혈액을 연결</span>했더니 늙은 생쥐의 근육·간·뇌가 젊어졌습니다. 이 실험이 시사하는 것은?",
    choices: ["노화는 혈액 속 신호 분자에 조절된다","노화는 단순한 마모다","수혈이 만병통치다","생쥐는 노화하지 않는다"],
    answer: 0,
    aha: "노화가 부품이 닳아 없어지는 「마모」가 아니라, 혈액 속 신호 분자가 조절하는 상태라는 뜻입니다. 조절되는 것이라면 되돌릴 수도 있다는 얘기죠. 그래서 노화 역전에는 두 길이 있습니다 — 손상을 수리하는 길(좀비 세포 제거, DNA 수선)과 세포를 젊은 상태로 다시 프로그래밍하는 길.",
    short: "혈액 속 신호 분자가 조절"
  },
  {
    cat: "기질 교체",
    q: "인공 심장을 달고 사는 사람들. 커즈와일이 이 사실에서 끌어내는 결론은?",
    choices: ["의료 기술은 아직 부족하다","인공 장기는 임시방편이다","나의 생존은 신체 어느 부위에도 달려있지 않다","심장이 곧 마음이다"],
    answer: 2,
    aha: "\"우리 자신의 생존은 신체 어느 부위의 생존에 달려있지 않다\" — 3장의 패턴 정체성 이론이 6장에서 의료의 현실이 되는 지점입니다. 아무도 인공 심장을 단 사람을 「인간이 아니다」라고 하지 않죠. 심장 박동기, 인공 와우, 인공 망막도 마찬가지고요. 커즈와일은 이 직관을 뇌 세포에까지 밀고 갑니다.",
    short: "어느 부위에도 달려있지 않다"
  },
  {
    cat: "견고성",
    q: "커즈와일이 자기 예측의 강점으로 내세우는 논리. \"이 미래는 기본적인 기하급수적 추세에 달려 있어서, <span class=\"em\">세부 가정이 크게 변해도 ___</span>.\" 뒤에 올 말은?",
    choices: ["결과는 완전히 달라질 것이다","그 단계에 이르는 시점에는 큰 변화가 없을 것이다","아무도 예측할 수 없다","10년쯤 늦어질 것이다"],
    answer: 1,
    aha: "\"그 단계에 이르는 시점에는 큰 변화가 없을 것이다\"입니다. 개별 기술이 몇 년 늦어져도 전체 곡선은 같은 시기에 같은 지점에 닿는다는 주장이죠. 물론 반론도 만만치 않습니다 — 동물 실험 결과가 사람에게 그대로 오지 않는 경우가 많고, 임상 시험은 언제나 예상보다 느리니까요. 그리고 혜택이 소수에게 먼저 간다면, 500세 노인과 20세 청년이 함께 사는 사회는 어떤 모습일까요?",
    short: "시점에는 큰 변화가 없다"
  }
];

let qi = -1;        // 현재 문제 인덱스
let stage = 0;      // 0: 문제, 1: 정답 공개, 2: 아하 공개
let picks = [];     // 문제별 내가 고른 보기 (안 골랐으면 null)
const $ = id => document.getElementById(id);

function buildDots() {
  $('dots').innerHTML = QUESTIONS.map((_, i) =>
    `<div class="dot${i < qi ? ' done' : i === qi ? ' on' : ''}"></div>`).join('');
}

function reveal() {
  const q = QUESTIONS[qi];
  const picked = picks[qi];
  $('qChoices').classList.add('revealed');
  if (picked !== null && picked !== undefined && picked !== q.answer) {
    $('qChoices').children[picked].classList.add('wrongpick');
  }
  $('nextBtn').textContent = '추가설명';
  stage = 1;
}

function pick(i) {
  if (stage !== 0) return;
  picks[qi] = i;
  reveal();
}

function renderQuestion() {
  const q = QUESTIONS[qi];
  $('qNo').textContent = qi + 1;
  $('qCat').textContent = q.cat;
  $('qText').innerHTML = q.q;
  $('qChoices').innerHTML = q.choices.map((c, i) =>
    `<div class="choice${i === q.answer ? ' correct' : ''}" onclick="pick(${i})"><span class="tag">${'①②③④'[i]}</span>${c}</div>`).join('');
  $('qChoices').classList.remove('revealed');
  $('qAha').classList.remove('show');
  $('qAhaText').textContent = q.aha;
  $('nextBtn').textContent = '정답';
  stage = 0;
  // 이미 답을 확인한 문제로 되돌아온 경우 — 채점 상태 복원
  if (picks[qi] !== undefined) {
    reveal();
    $('qAha').classList.add('show');
    $('nextBtn').textContent = qi === QUESTIONS.length - 1 ? '결과 보기' : '다음 문제';
    stage = 2;
  }
  buildDots();
}

function show(id) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  $(id).classList.add('active');
}

function start() {
  qi = 0;
  show('quiz');
  renderQuestion();
}

function advance() {
  if (stage === 0) {
    if (picks[qi] === undefined) picks[qi] = null; // 진행자 모드 — 고르지 않고 공개
    reveal();
  } else if (stage === 1) {
    $('qAha').classList.add('show');
    $('nextBtn').textContent = qi === QUESTIONS.length - 1 ? '결과 보기' : '다음 문제';
    stage = 2;
  } else {
    if (qi === QUESTIONS.length - 1) { finish(); return; }
    qi++;
    renderQuestion();
    show('quiz');
  }
}

function back() {
  if (qi > 0) { qi--; renderQuestion(); }
}

function finish() {
  const answered = picks.filter(p => p !== null && p !== undefined).length;
  const score = picks.filter((p, i) => p === QUESTIONS[i].answer).length;
  if (answered > 0) {
    $('finTitle').textContent = `열 문제 중 ${score}문제!`;
    $('finMsg').textContent =
      score >= 9 ? '특이점급입니다. 1장을 다시 읽을 필요가 없겠는데요.' :
      score >= 7 ? '수확 가속의 법칙 — 읽은 만큼 돌아왔습니다.' :
      score >= 4 ? '연못의 절반쯤 왔습니다. 내일이면 가득 찹니다.' :
                   '아직 스물아홉 번째 날 — 틀린 자리를 다시 펼치면 됩니다.';
  } else {
    $('finTitle').textContent = '열 문제, 모두 끝났습니다';
    $('finMsg').textContent = '이제 채점하고, 상품 받으러 나오세요.';
  }
  $('recapTable').innerHTML = QUESTIONS.map((q, i) => {
    const p = picks[i];
    const ox = (p === null || p === undefined) ? '<td class="ox n">−</td>'
      : p === q.answer ? '<td class="ox o">O</td>' : '<td class="ox x">X</td>';
    return `<tr><td class="no">${i + 1}</td>${ox}<td>${q.cat}</td><td class="ans">${q.short}</td></tr>`;
  }).join('');
  show('finale');
}

function restart() {
  qi = -1;
  picks = [];
  show('cover');
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowRight' || e.code === 'Enter') {
    e.preventDefault();
    if ($('cover').classList.contains('active')) start();
    else if ($('quiz').classList.contains('active')) advance();
  } else if (e.code === 'ArrowLeft' && $('quiz').classList.contains('active')) {
    back();
  }
});
</script>
