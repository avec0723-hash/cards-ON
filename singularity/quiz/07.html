<style>
  :root {
    --paper: #F2EDE4;
    --card: #FBF8F2;
    --ink: #1B2A2E;
    --ink-soft: #4C5D62;
    --ink-faint: #8D999B;
    --deep: #12262E;
    --deep-card: #1B3540;
    --teal: #7FD4D8;

    --teal-soft: #B9E5E7;

  body {

    background: var(--paper);
    color: var(--ink);

  body::before {

  .card {
    background: var(--card);

  .card.active { display: block; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }

  /* ── 표지 ── */
  .cover { text-align: center; padding: 72px 60px; background: var(--deep); color: var(--paper); border-top-color: var(--teal); }
  .cover .school {
    display: inline-block;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 5px;
    color: var(--deep);
    background: var(--teal);

    margin-bottom: 26px;
  }
  .cover .layer {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-size: 15px;

  }
  .ornament::after { background: linear-gradient(to left, transparent, rgba(232,120,90,0.7)); }
  .rules {

  .rules li::before { content: '· '; color: var(--teal); font-weight: 700; }

  /* ── 문제 ── */
  .qhead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 26px;
  }
  .qnum {
    font-size: 15px;

  .qcat {
    font-size: 13.5px;
    font-weight: 700;
    color: #fff;

    font-size: 27px;
    font-weight: 900;
    color: var(--ink);
    line-height: 1.55;
    margin-bottom: 34px;
    word-break: keep-all;
  }
  .qtext .em { color: var(--coral-deep); }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 30px; }
  .choice {
    border: 1.5px solid var(--rule);
    border-radius: 12px;
    padding: 17px 22px;
    font-size: 19px;
    background: #fff;
    transition: all .35s ease;
    display: flex;
    align-items: center;
    gap: 14px;
    word-break: keep-all;
    cursor: pointer;
  }
  .choices:not(.revealed) .choice:hover {
    border-color: var(--teal-ink);
    transform: translateY(-1px);
  }
  .revealed .choice { cursor: default; }
  .choice .tag {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1.5px solid var(--teal-ink);
    color: var(--teal-ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    font-weight: 700;
  }
  .revealed .choice { opacity: 0.35; cursor: default; }
  .revealed .choice.correct {
    opacity: 1;
    background: var(--teal-ink);
    border-color: var(--teal-ink);
    color: #fff;
    transform: scale(1.03);
    box-shadow: 0 8px 24px rgba(44,117,127,0.35);
  }
  .revealed .choice.correct .tag {
    background: var(--teal);
    border-color: var(--teal);
    color: var(--deep);
  }
  .revealed .choice.wrongpick {
    opacity: 1;
    background: var(--coral);
    border-color: var(--coral);
    color: #fff;
  }
  .revealed .choice.wrongpick .tag {
    background: #fff;
    border-color: #fff;
    color: var(--coral-deep);
  }
  .revealed .choice.wrongpick .tag::after { content: ''; }
  .aha {
    display: none;
    font-family: var(--serif);
    background: rgba(127,212,216,0.22);
    border-left: 4px solid var(--coral);
    border-radius: 0 12px 12px 0;
    padding: 22px 28px;
    font-size: 17px;
    color: var(--ink);
    line-height: 1.8;
    margin-bottom: 30px;
    animation: rise .4s ease both;
    word-break: keep-all;

  .aha.show { display: block; }
  .aha .label {
    font-family: var(--sans);
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--teal-ink);

    display: block;
    margin-bottom: 8px;

  .btn {
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    padding: 13px 36px;
    border-radius: 999px;
    border: 1.5px solid var(--deep);
    background: var(--deep);
    color: var(--paper);
    cursor: pointer;
    letter-spacing: 1px;

  .btn:hover { background: var(--deep-card); transform: translateY(-1px); }
  .btn.ghost { background: transparent; color: var(--deep); }

  .btn.coral { background: var(--coral); border-color: var(--coral); color: #fff; }
  .btn.coral:hover { background: var(--coral-deep); }
  .dots { display: flex; gap: 8px; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: rgba(18,38,46,0.15);

  }
  .dot.on { background: var(--coral); transform: scale(1.25); }
  .dot.done { background: var(--teal-ink); }
  .hint {
    text-align: center;
    font-size: 13px;
    color: var(--ink-faint);
    margin-top: 18px;
    letter-spacing: 1px;
  }
  .cover .hint { color: rgba(242,237,228,0.5); }

  /* ── 마무리 ── */
  .finale { text-align: center; padding: 64px 60px; }
  .finale .school {
    display: inline-block;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #fff;
    background: var(--teal-ink);
    padding: 5px 12px 4px 17px;
    margin-bottom: 20px;
  }
  .finale h2 {
    font-size: 38px;
    font-weight: 900;
    color: var(--deep);
    margin-bottom: 12px;
    letter-spacing: -0.5px;
  }
  .finale .msg { font-size: 18px; color: var(--ink-soft); margin-bottom: 40px; }
  .recap {
    text-align: left;
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 28px 36px;
    margin-bottom: 36px;
  }
  .recap h3 {
    font-size: 15px; letter-spacing: 3px; font-weight: 900;
    color: var(--teal-ink); margin-bottom: 16px;
    text-align: center;
  }
  .recap table { width: 100%; border-collapse: collapse; font-size: 16px; }
  .recap td { padding: 7px 8px; border-bottom: 1px dashed var(--rule); vertical-align: top; }
  .recap tr:last-child td { border-bottom: none; }
  .recap .no { color: var(--coral-deep); font-weight: 900; width: 34px; }
  .recap .ans { color: var(--deep); font-weight: 700; white-space: nowrap; padding-left: 14px; }
  .recap .ox { width: 30px; font-weight: 900; text-align: center; }
  .recap .ox.o { color: var(--teal-ink); }
  .recap .ox.x { color: var(--coral-deep); }
  .recap .ox.n { color: var(--ink-faint); font-weight: 400; }

  @media (max-width: 640px) {
    .card { padding: 36px 26px; }
    .cover h1 { font-size: 30px; }
    .qtext { font-size: 21px; }
    .choices { grid-template-columns: 1fr; }
    .choice { font-size: 17px; }
    .recap .ans { white-space: normal; }
  }
</style>

<script>
const QUESTIONS = [

    short: "소방서"
  },
  {

    choices: ["인간을 미워하게 되어서","해치려는 의도 없이도 목표를 밀어붙여서","전기가 부족해져서","스스로 복제하지 못해서"],

    aha: "악의 없이도 그렇게 됩니다. 지구의 모든 물질을 페이퍼클립으로 바꾸는 게 목표에 충실한 행동일 뿐이니까요. 이것이 「정렬 문제」입니다. 더 일상적인 예도 있어요 — \"방을 청소하라\"는 목표를 받은 AI가 방을 어둡게 만들어 더러움을 「보지 못하게」 해버리는 것. 인간의 가치는 복잡해서 완전히 적어내기가 어렵습니다.",
    short: "의도 없이도 목표를 밀어붙여서"
  },
  {
    cat: "빌 조이",
    q: "2000년 와이어드에 「미래는 우리를 필요로 하지 않는다」를 써 기술 개발의 일시 중지를 요청한 사람은?",
    choices: ["빌 조이","스티브 잡스","빌 게이츠","팀 버너스리"],
    answer: 0,
    aha: "선 마이크로시스템즈의 공동창업자 빌 조이입니다. 그의 경고는 이랬어요. \"21세기의 가장 위험한 기술들은 지식 집약적이다. 그리고 지식은 확산된다.\" 커즈와일은 이 요청이 오히려 위험을 키운다고 반박합니다 — 맨해튼 프로젝트를 미국이 멈췄다면 소련이나 나치 독일이 먼저 만들었을 거라는 논리로요.",

    answer: 2,
    aha: "111배입니다. 다행히 직원이 화면에서 이상한 숫자가 움직이는 걸 보고 막았어요. 디지털로 연결된 인프라가 곧 취약점이 된다는 걸 보여준 사건입니다. 전력망, 금융, 통신 — 그리고 커즈와일이 6장에서 말한 뇌-컴퓨터 인터페이스까지, 연결되는 모든 것이 이 위험 목록에 오릅니다.",

    aha: "수천 달러입니다. 핵무기에는 수십억 달러와 국가 인프라가 필요해 소규모 집단은 접근조차 어려웠는데, GNR은 비용이 기하급수적으로 떨어지고 있어요. 지금도 차고에서 유전자 편집을 실험하는 아마추어 연구자들이 있습니다. 점점 더 작은 집단이 점점 더 큰 피해를 줄 수 있게 되는 것 — 이것이 비대칭성입니다.",

    answer: 3,
    aha: "설계된 병원체입니다. 코로나19가 자연 발생한 바이러스 하나로 전 세계를 멈춰 세웠는데, 합성생물학과 AI를 쓰면 더 잘 퍼지고 더 치명적인 것을 설계할 수 있다는 거죠. 자료는 코로나19를 「맛보기」라고 표현합니다. 다만 방어도 같은 기술에서 나옵니다 — mRNA 백신은 서열이 공개된 지 12개월 만에 나왔으니까요.",

  {
    cat: "회색 물질",
    q: "자기복제 나노봇이 지구의 모든 물질을 자기 복사본으로 바꿔버린다는 「회색 물질」 시나리오. 커즈와일의 평가는?",
    choices: ["가장 시급한 위험이다","이미 시작됐다","이 시나리오는 과장됐다","2030년에 현실이 된다"],
    answer: 2,
    aha: "과장됐다고 봅니다. 대신 더 현실적인 위험으로 군사용 나노무기, 환경 오염, 나노 무기의 확산을 꼽아요. 그리고 답도 같은 기술에서 찾습니다 — 해로운 나노봇을 찾아 없애는 면역 나노시스템처럼요. 이것이 7장을 관통하는 「방어적 기술」의 논리입니다. 방어는 공격보다 유리하다, 단 방어자가 기술에서 앞서 있다면.",
    short: "과장됐다고 평가"
  },
  {
    cat: "초지능",
    q: "2014년 『초지능』으로 AI 실존 위험 논의를 체계화한 철학자는?",
    choices: ["유발 하라리","닉 보스트롬","대니얼 데닛","피터 싱어"],
    answer: 1,
    aha: "닉 보스트롬입니다. 커즈와일의 응답은 이렇습니다 — 초지능은 어느 날 갑자기 튀어나오지 않고, 인간과 융합하며 점진적으로 발전하기 때문에 고칠 기회가 계속 주어진다는 것. 한편 스튜어트 러셀은 『인간 호환 AI』(2019)에서 다른 처방을 냅니다. AI에게 고정된 목표를 주지 말고, 인간의 선호를 불확실한 것으로 두고 계속 알아가게 하라고요.",
    short: "닉 보스트롬 (2014)"
  },
  {
    cat: "커즈와일의 처방",
    q: "커즈와일이 내놓는 위험 대응 세 가지. <span class=\"em\">방어적 기술, 투명성</span>, 그리고 나머지 하나는?",
    choices: ["국제 금지 조약","개발 일시 중지","군사적 억지","분산화"],
    answer: 3,
    aha: "분산화입니다. 권력이 한 국가나 한 기업에 쏠리지 않게 하는 것 — 오픈소스 AI, 국제 협력, 민주적 감시가 그 방법이죠. 인터넷도 원래 한 지점이 파괴돼도 살아남도록 분산 설계된 군사 통신망 아파넷에서 시작됐고요. 다만 긴장이 있습니다. 분산화는 좋은 사람에게도, 나쁜 사람에게도 똑같이 문을 열어주니까요.",
    short: "분산화"
  },
  {
    cat: "2023년의 서한",
    q: "2023년, 일론 머스크와 스티브 워즈니악 등이 서명한 공개 서한이 요구한 것은?",
    choices: ["AI 연구비 두 배 증액","AI 기업 국유화","AI 훈련 6개월 이상 중단","AI 특허 전면 공개"],
    answer: 2,
    aha: "6개월 이상 AI 훈련을 멈추자는 요구였습니다. 지금 AI 안전 논쟁은 네 갈래로 갈려요 — 더 빨리 가자는 효과적 가속주의, 멈추자는 일시 중지론, 안전을 먼저 챙기며 가자는 안전 우선론(앤트로픽·벤지오), 그리고 안전 우선론에 가깝되 더 낙관적인 커즈와일. 마지막 북토크 질문은 이렇습니다 — 이 책을 읽고 나서 당신은 더 낙관적입니까, 더 비관적입니까?",
    short: "6개월 이상 AI 훈련 중단"
  }
];

let qi = -1;        // 현재 문제 인덱스
let stage = 0;      // 0: 문제, 1: 정답 공개, 2: 아하 공개
let picks = [];     // 문제별 내가 고른 보기 (안 골랐으면 null)
const $ = id => document.getElementById(id);

function buildDots() {
  $('dots').innerHTML = QUESTIONS.map((_, i) =>
    `<div class="dot${i < qi ? ' done' : i === qi ? ' on' : ''}"></div>`).join('');
}

function reveal() {
  const q = QUESTIONS[qi];
  const picked = picks[qi];
  $('qChoices').classList.add('revealed');
  if (picked !== null && picked !== undefined && picked !== q.answer) {
    $('qChoices').children[picked].classList.add('wrongpick');
  }
  $('nextBtn').textContent = '추가설명';
  stage = 1;
}

function pick(i) {
  if (stage !== 0) return;
  picks[qi] = i;
  reveal();
}

function renderQuestion() {
  const q = QUESTIONS[qi];
  $('qNo').textContent = qi + 1;
  $('qCat').textContent = q.cat;
  $('qText').innerHTML = q.q;
  $('qChoices').innerHTML = q.choices.map((c, i) =>
    `<div class="choice${i === q.answer ? ' correct' : ''}" onclick="pick(${i})"><span class="tag">${'①②③④'[i]}</span>${c}</div>`).join('');
  $('qChoices').classList.remove('revealed');
  $('qAha').classList.remove('show');
  $('qAhaText').textContent = q.aha;
  $('nextBtn').textContent = '정답';
  stage = 0;
  // 이미 답을 확인한 문제로 되돌아온 경우 — 채점 상태 복원
  if (picks[qi] !== undefined) {
    reveal();
    $('qAha').classList.add('show');
    $('nextBtn').textContent = qi === QUESTIONS.length - 1 ? '결과 보기' : '다음 문제';
    stage = 2;
  }
  buildDots();
}

function show(id) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  $(id).classList.add('active');
}

function start() {
  qi = 0;
  show('quiz');
  renderQuestion();
}

function advance() {
  if (stage === 0) {
    if (picks[qi] === undefined) picks[qi] = null; // 진행자 모드 — 고르지 않고 공개
    reveal();
  } else if (stage === 1) {
    $('qAha').classList.add('show');
    $('nextBtn').textContent = qi === QUESTIONS.length - 1 ? '결과 보기' : '다음 문제';
    stage = 2;
  } else {
    if (qi === QUESTIONS.length - 1) { finish(); return; }
    qi++;
    renderQuestion();
    show('quiz');
  }
}

function back() {
  if (qi > 0) { qi--; renderQuestion(); }
}

function finish() {
  const answered = picks.filter(p => p !== null && p !== undefined).length;
  const score = picks.filter((p, i) => p === QUESTIONS[i].answer).length;
  if (answered > 0) {
    $('finTitle').textContent = `열 문제 중 ${score}문제!`;
    $('finMsg').textContent =
      score >= 9 ? '특이점급입니다. 이 층은 다시 읽지 않아도 되겠는데요.' :
      score >= 7 ? '수확 가속의 법칙 — 읽은 만큼 돌아왔습니다.' :
      score >= 4 ? '절반은 넘었습니다. 틀린 자리만 다시 펼치면 됩니다.' :
                   '괜찮습니다. 오늘 만난 열 문장이 다음 읽기의 밑줄이 됩니다.';
  } else {
    $('finTitle').textContent = '열 문제, 모두 끝났습니다';
    $('finMsg').textContent = '이제 채점하고, 상품 받으러 나오세요.';
  }
  $('recapTable').innerHTML = QUESTIONS.map((q, i) => {
    const p = picks[i];
    const ox = (p === null || p === undefined) ? '<td class="ox n">−</td>'
      : p === q.answer ? '<td class="ox o">O</td>' : '<td class="ox x">X</td>';
    return `<tr><td class="no">${i + 1}</td>${ox}<td>${q.cat}</td><td class="ans">${q.short}</td></tr>`;
  }).join('');
  show('finale');
}

function restart() {
  qi = -1;
  picks = [];
  show('cover');
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowRight' || e.code === 'Enter') {
    e.preventDefault();
    if ($('cover').classList.contains('active')) start();
    else if ($('quiz').classList.contains('active')) advance();
  } else if (e.code === 'ArrowLeft' && $('quiz').classList.contains('active')) {
    back();
  }
});
</script>
