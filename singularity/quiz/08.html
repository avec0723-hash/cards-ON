<style>
  :root {
    --paper: #F2EDE4;
    --card: #FBF8F2;
    --ink: #1B2A2E;
    --ink-soft: #4C5D62;
    --ink-faint: #8D999B;
    --deep: #12262E;
    --deep-card: #1B3540;
    --teal: #7FD4D8;
    --teal-ink: #2C757F;
    --teal-soft: #B9E5E7;
    --coral: #E8785A;
    --coral-deep: #D45C3D;
    --rule: #D7CFC1;
    --sans: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    --serif: "Nanum Myeongjo", "Noto Serif KR", "Batang", serif;
    --shadow: 0 10px 40px rgba(18, 38, 46, 0.16);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 12% 18%, rgba(127,212,216,0.10) 0, transparent 30%),
      radial-gradient(circle at 88% 82%, rgba(232,120,90,0.08) 0, transparent 35%);
    pointer-events: none;
  }
  .stage {
    width: 100%;
    max-width: 880px;
    position: relative;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--rule);
    border-top: 4px solid var(--coral);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 56px 60px 48px;
    display: none;
    animation: rise .45s ease both;
  }
  .card.active { display: block; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── 표지 ── */
  .cover { text-align: center; padding: 72px 60px; background: var(--deep); color: var(--paper); border-top-color: var(--teal); }
  .cover .school {
    display: inline-block;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 5px;
    color: var(--deep);
    background: var(--teal);
    padding: 6px 14px 5px 19px;
    margin-bottom: 26px;
  }
  .cover .layer {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-size: 15px;
    letter-spacing: 4px;
    color: var(--coral);
    margin-bottom: 10px;
  }
  .cover .layer .nn { font-size: 34px; letter-spacing: 0; }
  .cover h1 {
    font-size: 44px;
    font-weight: 900;
    color: var(--paper);
    letter-spacing: -0.5px;
    line-height: 1.3;
    margin-bottom: 14px;
  }
  .cover h1 .em { color: var(--teal); }
  .cover .sub {
    font-size: 17px;
    color: rgba(242,237,228,0.8);
    margin-bottom: 40px;
  }
  .ornament {
    display: flex; align-items: center; justify-content: center;
    gap: 14px; margin: 28px 0 36px;
    color: var(--coral);
    font-size: 14px;
  }
  .ornament::before, .ornament::after {
    content: '';
    width: 90px; height: 1px;
    background: linear-gradient(to right, transparent, rgba(232,120,90,0.7));
  }
  .ornament::after { background: linear-gradient(to left, transparent, rgba(232,120,90,0.7)); }
  .rules {
    display: inline-block;
    text-align: left;
    background: var(--deep-card);
    border: 1px solid rgba(127,212,216,0.25);
    border-radius: 12px;
    padding: 22px 32px;
    font-size: 15.5px;
    color: rgba(242,237,228,0.88);
    margin-bottom: 42px;
  }
  .rules li { list-style: none; padding: 3px 0; }
  .rules li::before { content: '· '; color: var(--teal); font-weight: 700; }

  /* ── 문제 ── */
  .qhead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 26px;
  }
  .qnum {
    font-size: 15px;
    letter-spacing: 3px;
    color: var(--teal-ink);
    font-weight: 700;
  }
  .qnum b { font-size: 26px; color: var(--coral-deep); letter-spacing: 0; }
  .qcat {
    font-size: 13.5px;
    font-weight: 700;
    color: #fff;
    background: var(--teal-ink);
    padding: 5px 16px;
    border-radius: 999px;
    letter-spacing: 1px;
  }
  .qtext {
    font-size: 27px;
    font-weight: 900;
    color: var(--ink);
    line-height: 1.55;
    margin-bottom: 34px;
    word-break: keep-all;
  }
  .qtext .em { color: var(--coral-deep); }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 30px; }
  .choice {
    border: 1.5px solid var(--rule);
    border-radius: 12px;
    padding: 17px 22px;
    font-size: 19px;
    background: #fff;
    transition: all .35s ease;
    display: flex;
    align-items: center;
    gap: 14px;
    word-break: keep-all;
    cursor: pointer;
  }
  .choices:not(.revealed) .choice:hover {
    border-color: var(--teal-ink);
    transform: translateY(-1px);
  }
  .revealed .choice { cursor: default; }
  .choice .tag {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1.5px solid var(--teal-ink);
    color: var(--teal-ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    font-weight: 700;
  }
  .revealed .choice { opacity: 0.35; cursor: default; }
  .revealed .choice.correct {
    opacity: 1;
    background: var(--teal-ink);
    border-color: var(--teal-ink);
    color: #fff;
    transform: scale(1.03);
    box-shadow: 0 8px 24px rgba(44,117,127,0.35);
  }
  .revealed .choice.correct .tag {
    background: var(--teal);
    border-color: var(--teal);
    color: var(--deep);
  }
  .revealed .choice.wrongpick {
    opacity: 1;
    background: var(--coral);
    border-color: var(--coral);
    color: #fff;
  }
  .revealed .choice.wrongpick .tag {
    background: #fff;
    border-color: #fff;
    color: var(--coral-deep);
  }
  .revealed .choice.wrongpick .tag::after { content: ''; }
  .aha {
    display: none;
    font-family: var(--serif);
    background: rgba(127,212,216,0.22);
    border-left: 4px solid var(--coral);
    border-radius: 0 12px 12px 0;
    padding: 22px 28px;
    font-size: 17px;
    color: var(--ink);
    line-height: 1.8;
    margin-bottom: 30px;
    animation: rise .4s ease both;
    word-break: keep-all;
  }
  .aha.show { display: block; }
  .aha .label {
    font-family: var(--sans);
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--teal-ink);
    font-weight: 900;
    display: block;
    margin-bottom: 8px;
  }

  /* ── 버튼·진행 ── */
  .controls { display: flex; justify-content: space-between; align-items: center; }
  .btn {
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    padding: 13px 36px;
    border-radius: 999px;
    border: 1.5px solid var(--deep);
    background: var(--deep);
    color: var(--paper);
    cursor: pointer;
    letter-spacing: 1px;
    transition: all .25s ease;
  }
  .btn:hover { background: var(--deep-card); transform: translateY(-1px); }
  .btn.ghost { background: transparent; color: var(--deep); }
  .btn.ghost:hover { background: rgba(18,38,46,0.06); }
  .btn.coral { background: var(--coral); border-color: var(--coral); color: #fff; }
  .btn.coral:hover { background: var(--coral-deep); }
  .dots { display: flex; gap: 8px; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: rgba(18,38,46,0.15);
    transition: all .3s ease;
  }
  .dot.on { background: var(--coral); transform: scale(1.25); }
  .dot.done { background: var(--teal-ink); }
  .hint {
    text-align: center;
    font-size: 13px;
    color: var(--ink-faint);
    margin-top: 18px;
    letter-spacing: 1px;
  }
  .cover .hint { color: rgba(242,237,228,0.5); }

  /* ── 마무리 ── */
  .finale { text-align: center; padding: 64px 60px; }
  .finale .school {
    display: inline-block;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #fff;
    background: var(--teal-ink);
    padding: 5px 12px 4px 17px;
    margin-bottom: 20px;
  }
  .finale h2 {
    font-size: 38px;
    font-weight: 900;
    color: var(--deep);
    margin-bottom: 12px;
    letter-spacing: -0.5px;
  }
  .finale .msg { font-size: 18px; color: var(--ink-soft); margin-bottom: 40px; }
  .recap {
    text-align: left;
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 28px 36px;
    margin-bottom: 36px;
  }
  .recap h3 {
    font-size: 15px; letter-spacing: 3px; font-weight: 900;
    color: var(--teal-ink); margin-bottom: 16px;
    text-align: center;
  }
  .recap table { width: 100%; border-collapse: collapse; font-size: 16px; }
  .recap td { padding: 7px 8px; border-bottom: 1px dashed var(--rule); vertical-align: top; }
  .recap tr:last-child td { border-bottom: none; }
  .recap .no { color: var(--coral-deep); font-weight: 900; width: 34px; }
  .recap .ans { color: var(--deep); font-weight: 700; white-space: nowrap; padding-left: 14px; }
  .recap .ox { width: 30px; font-weight: 900; text-align: center; }
  .recap .ox.o { color: var(--teal-ink); }
  .recap .ox.x { color: var(--coral-deep); }
  .recap .ox.n { color: var(--ink-faint); font-weight: 400; }

  @media (max-width: 640px) {
    .card { padding: 36px 26px; }
    .cover h1 { font-size: 30px; }
    .qtext { font-size: 21px; }
    .choices { grid-template-columns: 1fr; }
    .choice { font-size: 17px; }
    .recap .ans { white-space: normal; }
  }
</style>

<script>
const QUESTIONS = [
  {

    q: "미래의 AI 카산드라가 커즈와일에게 건넨 말. \"우리는 당신의 뇌를 에뮬레이션(복제)하지 않아요. 우리는 거기에 새로운 것을 <span class=\"em\">___</span>할 뿐이에요.\"",

    short: "추가 (대체가 아니라)"
  },
  {
    cat: "이름의 아이러니",
    q: "커즈와일이 대화 상대에게 붙인 이름 「카산드라」. 그리스 신화 속 카산드라는 어떤 인물이었을까요?",
    choices: ["거짓 예언으로 벌을 받은 인물","미래를 볼 수 없는 눈먼 인물","아무도 믿지 않는 예언을 하는 인물","신들의 전령"],

    aha: "아무도 믿어주지 않는 예언을 하는 인물입니다. 커즈와일 자신도 오랫동안 일종의 카산드라였다는 아이러니가 이름에 담겨 있죠. 그리고 형식 자체가 메시지입니다 — 주장하는 대신 대화를 보여줌으로써, AI가 진짜 철학적 대화 상대가 될 수 있음을 직접 시연한 겁니다. 플라톤이 소크라테스의 입을 빌린 것처럼요.",
    short: "아무도 믿지 않는 예언자"
  },
  {
    cat: "뇌의 역사",
    q: "「추가」가 인류 역사의 반복 패턴이라는 근거. 우리 뇌가 쌓여 온 순서는?",
    choices: ["신피질 → 포유류 뇌 → 파충류 뇌","파충류 뇌 → 포유류 뇌 → 신피질","포유류 뇌 → 파충류 뇌 → 신피질","셋이 동시에 생겼다"],
    answer: 1,
    aha: "파충류 뇌 위에 포유류 뇌가, 그 위에 신피질이 얹혔습니다. 어느 단계에서도 아래층이 지워지지 않았어요. 소통의 역사도 같습니다 — 언어 위에 문자가, 그 위에 인쇄기가, 그 위에 인터넷이 더해졌지, 앞의 것이 사라지지 않았죠. 이것이 이 북토크 시리즈의 표어이기도 합니다. \"아래는 지워지지 않는다.\"",

  {

    q: "지금 우리 신피질에는 패턴 인식기가 <span class=\"em\">약 몇 개</span> 있다고 8장은 말할까요?",
    choices: ["약 3천 개","약 300만 개","약 3조 개","약 300억 개"],
    answer: 3,
    aha: "약 300억 개입니다. 다만 두개골 크기와 에너지 소비라는 물리적 한계에 묶여 있죠. 융합은 세 단계로 진행됩니다 — 지금은 스마트폰과 검색엔진처럼 바깥의 도구로 쓰고, 중기에는 뇌-컴퓨터 인터페이스로 신경을 잇고, 특이점 이후에는 신피질이 클라우드와 직접 통합됩니다.",

  {

    choices: ["의료 기록","편지·음악·사진","유전자 샘플","음성 녹음만"],
    answer: 1,
    aha: "편지와 음악과 사진입니다. 아버지는 음악가였어요. 이 대목에서 8장은 기술 예측서에서 한 사람의 마음으로 내려옵니다 — 특이점이란 결국 사랑하는 사람의 패턴을 되찾고 싶은 마음이기도 하다는 것. 「추가」의 가장 사적인 표현인 셈이죠.",
    short: "편지·음악·사진"
  },
  {
    cat: "칼 세이건",
    q: "8장이 인용하는 칼 세이건의 문장. \"우리는 <span class=\"em\">우주가 ___ 위해</span> 만들어낸 방법이다.\"",

    aha: "\"우주가 자기 자신을 알기 위해\"입니다. 커즈와일은 여기서 가장 먼 그림을 그립니다 — 융합된 문명이 은하 규모로 퍼져 나가고, 우주의 물질이 지능을 갖게 되는 것. 특이점이 곧 우주의 자기의식화라는 겁니다. 1장의 여섯 번째 시대, 돌멩이도 컴퓨트로늄이 된다던 그 이야기가 여기서 다시 닫힙니다.",
    short: "자기 자신을 알기 위해"
  },
  {
    cat: "의미의 문제",
    q: "\"죽음이 없다면 삶의 의미도 없다\"는 반론에 대한 카산드라의 응답은?",
    choices: ["의미는 개인이 정할 문제가 아니다","의미는 애초에 환상이다","수명은 어차피 무한해지지 않는다","의미는 유한성이 아니라 목적·관계·창의성에서 온다"],
    answer: 3,
    aha: "의미는 유한성이 아니라 목적과 관계와 창의성에서 온다는 것입니다. 예술가 비유가 따라붙어요 — 그림을 그리는 이유가 언젠가 죽기 때문인가, 아니면 아름다움을 만드는 일 자체가 의미 있기 때문인가? 3장의 물음이 여기서 다시 울립니다. \"나는 어떤 사람이 될 수 있는가?\"",
    short: "목적·관계·창의성에서 온다"
  },
  {
    cat: "99%의 질문",
    q: "「추가론」의 가장 아픈 곳을 찌르는 북토크 질문. \"새로운 지능이 전체의 <span class=\"em\">99%</span>를 차지하고 생물학적 뇌가 1%만 남아도 ___입니까?\"",
    choices: ["살아있는 것","인간","추가","자유"],
    answer: 2,
    aha: "\"그래도 추가입니까?\" — 추가와 대체의 경계가 어디냐는 질문입니다. 자료가 스스로 이 약점을 적어 두었어요. 새로운 지능이 너무 많이 더해지면 「생물학적 뇌의 나」는 사실상 곁다리가 되는 것 아니냐고요. 그 1%가 여전히 「나」를 정의할 수 있을까요? 8월 31일 북토크에서 나눌 만한 질문입니다.",
    short: "추가 (경계는 어디인가)"
  },
  {
    cat: "지금 이 대화",
    q: "8장을 읽는 우리에게 자료가 건네는 말. \"지금 당신이 Claude·ChatGPT와 나누는 대화는 이미 <span class=\"em\">___</span>이다.\"",
    choices: ["카산드라와의 대화의 초기 형태","무의미한 놀이","위험한 실험","인간의 마지막 대화"],
    answer: 0,
    aha: "\"카산드라와의 대화의 초기 형태\"입니다. 그리고 이렇게 묻죠 — 2024년의 AI와 나누는 대화가 이 정도라면, 2029년과 2035년에는 어떤 대화가 가능할까? 그런데 판단하기 어려운 질문이 하나 남습니다. 카산드라는 경험을 하는가? 우리는 다른 사람의 의식도 행동과 말로 추론할 뿐인데, AI에게는 다른 기준을 들이대야 할까요?",
    short: "카산드라와의 대화의 초기 형태"
  },
  {
    cat: "여덟 층",
    q: "8장 표지에 적힌 문장이자 이 한 달 여정의 결론. \"여덟 층이 다 쌓였습니다. <span class=\"em\">아래 일곱은 ___</span>.\"",
    choices: ["기억나지 않습니다","이제 필요 없습니다","모두 새로 써야 합니다","하나도 지워지지 않았습니다"],
    answer: 3,
    aha: "\"하나도 지워지지 않았습니다.\" 8장은 앞의 일곱 장이 하나로 모이는 자리입니다 — 1장의 여섯 시대, 2장의 지능, 3장의 정체성, 4장의 진보, 5장의 일, 6장의 건강, 7장의 위험이 카산드라와의 대화에서 각각 답을 받습니다. 교향곡의 마지막 악장에서 앞선 주제들이 하나로 수렴하듯이요. 8월 31일 저녁 8시, 밑줄 한 문장과 질문 한 줄을 들고 만납니다.",
    short: "하나도 지워지지 않았습니다"
  }
];

let qi = -1;        // 현재 문제 인덱스
let stage = 0;      // 0: 문제, 1: 정답 공개, 2: 아하 공개
let picks = [];     // 문제별 내가 고른 보기 (안 골랐으면 null)
const $ = id => document.getElementById(id);

function buildDots() {
  $('dots').innerHTML = QUESTIONS.map((_, i) =>
    `<div class="dot${i < qi ? ' done' : i === qi ? ' on' : ''}"></div>`).join('');
}

function reveal() {
  const q = QUESTIONS[qi];
  const picked = picks[qi];
  $('qChoices').classList.add('revealed');
  if (picked !== null && picked !== undefined && picked !== q.answer) {
    $('qChoices').children[picked].classList.add('wrongpick');
  }
  $('nextBtn').textContent = '추가설명';
  stage = 1;
}

function pick(i) {
  if (stage !== 0) return;
  picks[qi] = i;
  reveal();
}

function renderQuestion() {
  const q = QUESTIONS[qi];
  $('qNo').textContent = qi + 1;
  $('qCat').textContent = q.cat;
  $('qText').innerHTML = q.q;
  $('qChoices').innerHTML = q.choices.map((c, i) =>
    `<div class="choice${i === q.answer ? ' correct' : ''}" onclick="pick(${i})"><span class="tag">${'①②③④'[i]}</span>${c}</div>`).join('');
  $('qChoices').classList.remove('revealed');
  $('qAha').classList.remove('show');
  $('qAhaText').textContent = q.aha;
  $('nextBtn').textContent = '정답';
  stage = 0;
  // 이미 답을 확인한 문제로 되돌아온 경우 — 채점 상태 복원
  if (picks[qi] !== undefined) {
    reveal();
    $('qAha').classList.add('show');
    $('nextBtn').textContent = qi === QUESTIONS.length - 1 ? '결과 보기' : '다음 문제';
    stage = 2;
  }
  buildDots();
}

function show(id) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  $(id).classList.add('active');
}

function start() {
  qi = 0;
  show('quiz');
  renderQuestion();
}

function advance() {
  if (stage === 0) {
    if (picks[qi] === undefined) picks[qi] = null; // 진행자 모드 — 고르지 않고 공개
    reveal();
  } else if (stage === 1) {
    $('qAha').classList.add('show');
    $('nextBtn').textContent = qi === QUESTIONS.length - 1 ? '결과 보기' : '다음 문제';
    stage = 2;
  } else {
    if (qi === QUESTIONS.length - 1) { finish(); return; }
    qi++;
    renderQuestion();
    show('quiz');
  }
}

function back() {
  if (qi > 0) { qi--; renderQuestion(); }
}

function finish() {
  const answered = picks.filter(p => p !== null && p !== undefined).length;
  const score = picks.filter((p, i) => p === QUESTIONS[i].answer).length;
  if (answered > 0) {
    $('finTitle').textContent = `열 문제 중 ${score}문제!`;
    $('finMsg').textContent =
      score >= 9 ? '특이점급입니다. 1장을 다시 읽을 필요가 없겠는데요.' :
      score >= 7 ? '수확 가속의 법칙 — 읽은 만큼 돌아왔습니다.' :
      score >= 4 ? '연못의 절반쯤 왔습니다. 내일이면 가득 찹니다.' :
                   '아직 스물아홉 번째 날 — 틀린 자리를 다시 펼치면 됩니다.';
  } else {
    $('finTitle').textContent = '열 문제, 모두 끝났습니다';
    $('finMsg').textContent = '이제 채점하고, 상품 받으러 나오세요.';
  }
  $('recapTable').innerHTML = QUESTIONS.map((q, i) => {
    const p = picks[i];
    const ox = (p === null || p === undefined) ? '<td class="ox n">−</td>'
      : p === q.answer ? '<td class="ox o">O</td>' : '<td class="ox x">X</td>';
    return `<tr><td class="no">${i + 1}</td>${ox}<td>${q.cat}</td><td class="ans">${q.short}</td></tr>`;
  }).join('');
  show('finale');
}

function restart() {
  qi = -1;
  picks = [];
  show('cover');
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowRight' || e.code === 'Enter') {
    e.preventDefault();
    if ($('cover').classList.contains('active')) start();
    else if ($('quiz').classList.contains('active')) advance();
  } else if (e.code === 'ArrowLeft' && $('quiz').classList.contains('active')) {
    back();
  }
});
</script>
